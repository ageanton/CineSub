              private fun updateFontSizeSp(newSizeSp: Float) {
                  SubtitleRepository.textSizeSp = newSizeSp
                  sizeLabel.text = "Subtitle Size: ${"%.1f".format(newSizeSp)}sp"
                  sizeSeek.progress = ((newSizeSp - 10.0f) * 10f).roundToInt().coerceIn(0, 260)
                  refreshLiveStyle()
              }

              private fun applySubtitleSpeed(multiplier: Double, labelDesc: String, updateSeek: Boolean = true) {
                  SubtitleRepository.fpsMultiplier = multiplier
                  speedStatusTv.text = "Active Speed: ${"%.3f".format(multiplier)}x ($labelDesc)"
                  if (updateSeek) {
                      speedSeek.progress = ((multiplier - 0.500) * 1000.0).roundToInt().coerceIn(0, 1500)
                  }
                  if (FloatingSubtitleService.isRunning) {
                      val intent = Intent(this, FloatingSubtitleService::class.java).apply {
                          action = FloatingSubtitleService.ACTION_UPDATE_SPEED
                      }
                      startService(intent)
                  }
              }

              override fun onResume() {
                  super.onResume()
                  val hasOverlay = Settings.canDrawOverlays(this)
                  statusBadge.text = if (hasOverlay) {
                      "Overlay Permission Ready — You can launch over any video app"
                  } else {
                      "Step 1 Required: Grant 'Draw over other apps' permission below"
                  }
                  statusBadge.setTextColor(
                      if (hasOverlay) Color.parseColor("#10B981") else Color.parseColor("#F59E0B")
                  )
              }

              private fun loadSubtitleFromUri(uri: Uri) {
                  try {
                      var displayName = "Custom_Subtitles.srt"
                      contentResolver.query(uri, null, null, null, null)?.use { cursor ->
                          val nameIndex = cursor.getColumnIndex(OpenableColumns.DISPLAY_NAME)
                          if (cursor.moveToFirst() && nameIndex >= 0) {
                              displayName = cursor.getString(nameIndex)
                          }
                      }
                      contentResolver.openInputStream(uri)?.use { stream ->
                          val text = SubtitleParser.readStreamWithCharsetDetection(stream)
                          val parsed = SubtitleParser.parse(text, displayName)
                          if (parsed.isNotEmpty()) {
                              SubtitleRepository.activeCues = parsed
                              SubtitleRepository.fileName = displayName
                              activeFileTv.text = "Loaded: $displayName (${parsed.size} cues)"
                              refreshLiveStyle()
                              Toast.makeText(this, "Loaded all ${parsed.size} subtitle lines!", Toast.LENGTH_SHORT).show()
                          } else {
                              Toast.makeText(this, "No valid subtitle timestamps found in file.", Toast.LENGTH_LONG).show()
                          }
                      }
                  } catch (e: Exception) {
                      Toast.makeText(this, "Error reading file: ${e.message}", Toast.LENGTH_LONG).show()
                  }
              }

              private fun refreshLiveStyle() {
                  previewSubView.applyStyleFromRepo(this)
                  if (FloatingSubtitleService.isRunning) {
                      val intent = Intent(this, FloatingSubtitleService::class.java).apply {
                          action = FloatingSubtitleService.ACTION_REFRESH_STYLE
                      }
                      startService(intent)
                  }
              }

              private fun createGlassCard(): LinearLayout {
                  return LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(16), dp(16), dp(16), dp(16))
                      background = GradientDrawable().apply {
                          cornerRadius = dp(18).toFloat()
                          setColor(Color.parseColor("#12131A"))
                          setStroke(dp(1), Color.parseColor("#22FFFFFF"))
                      }
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      ).apply { bottomMargin = dp(16) }
                  }
              }

              private fun createSectionLabel(txt: String): TextView {
                  return TextView(this).apply {
                      text = txt
                      setTextColor(Color.parseColor("#94A3B8"))
                      textSize = 11f
                      setTypeface(typeface, Typeface.BOLD)
                      letterSpacing = 0.08f
                  }
              }

              private fun createSmallSteppingButton(label: String, onClick: () -> Unit): Button {
                  return Button(this).apply {
                      text = label
                      isAllCaps = false
                      textSize = 11f
                      setTextColor(Color.WHITE)
                      minWidth = 0
                      minimumWidth = 0
                      minHeight = 0
                      minimumHeight = 0
                      setPadding(dp(10), dp(5), dp(10), dp(5))
                      background = GradientDrawable().apply {
                          cornerRadius = dp(8).toFloat()
                          setColor(Color.parseColor("#1E293B"))
                      }
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.WRAP_CONTENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      ).apply { marginStart = dp(6) }
                      setOnClickListener { onClick() }
                  }
              }

              private fun createAccentButton(label: String, bgHex: String, fgHex: String, onClick: () -> Unit): Button {
                  return Button(this).apply {
                      text = label
                      isAllCaps = false
                      setTextColor(Color.parseColor(fgHex))
                      textSize = 12f
                      setTypeface(typeface, Typeface.BOLD)
                      gravity = Gravity.CENTER
                      background = GradientDrawable().apply {
                          cornerRadius = dp(12).toFloat()
                          setColor(Color.parseColor(bgHex))
                      }
                      setOnClickListener { onClick() }
                  }
              }

              private fun dp(value: Int): Int {
                  return TypedValue.applyDimension(
                      TypedValue.COMPLEX_UNIT_DIP,
                      value.toFloat(),
                      resources.displayMetrics
                  ).toInt()
              }
          }
          """)
