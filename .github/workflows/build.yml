                  // Full-Movie Virtualized ListView Transcript Drawer
                  transcriptAdapter = SubtitleLinesAdapter()
                  transcriptListView = ListView(this).apply {
                      adapter = transcriptAdapter
                      divider = null
                      dividerHeight = dpToPx(2)
