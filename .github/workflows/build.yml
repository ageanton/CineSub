                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          dpToPx(170)
                      ).apply { topMargin = dpToPx(8) }

                      setOnTouchListener { _, event ->
                          if (event.actionMasked == MotionEvent.ACTION_MOVE || event.actionMasked == MotionEvent.ACTION_DOWN) {
                              userScrollingUntilMs = SystemClock.elapsedRealtime() + 4500L
                          }
                          false
                      }
                  }

                  expandedDeck.addView(headerRow)
                  expandedDeck.addView(scrubRow)
                  expandedDeck.addView(primaryTransportRow)
                  expandedDeck.addView(secondaryUtilityRow)
                  expandedDeck.addView(transcriptListView)

                  controllerRoot.addView(expandedDeck)
                  controllerRoot.addView(collapsedPill, FrameLayout.LayoutParams(dpToPx(40), dpToPx(40)))

                  controllerParams = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.END
                      x = dpToPx(14)
                      y = dpToPx(80)
                  }

                  val dragListener = object : View.OnTouchListener {
                      private var initialX = 0
                      private var initialY = 0
                      private var touchX = 0f
                      private var touchY = 0f
                      override fun onTouch(v: View, event: MotionEvent): Boolean {
                          when (event.actionMasked) {
                              MotionEvent.ACTION_DOWN -> {
                                  if (v == collapsedPill) {
                                      tickerHandler.removeCallbacks(pillDimRunnable)
                                      collapsedPill.animate().alpha(0.90f).setDuration(120).start()
                                  }
                                  initialX = controllerParams.x
                                  initialY = controllerParams.y
                                  touchX = event.rawX
                                  touchY = event.rawY
                                  return true
                              }
                              MotionEvent.ACTION_MOVE -> {
                                  controllerParams.x = (initialX - (event.rawX - touchX)).toInt()
                                  controllerParams.y = (initialY + (event.rawY - touchY)).toInt()
                                  windowManager.updateViewLayout(controllerRoot, controllerParams)
                                  return true
                              }
                              MotionEvent.ACTION_UP -> {
                                  if (abs(event.rawX - touchX) < 12 && abs(event.rawY - touchY) < 12) {
                                      if (v == collapsedPill) {
                                          collapsedPill.visibility = View.GONE
                                          expandedDeck.visibility = View.VISIBLE
                                      }
                                  } else if (v == collapsedPill) {
                                      schedulePillAutoDim()
                                  }
                                  return true
                              }
                          }
                          return false
                      }
                  }

                  headerRow.setOnTouchListener(dragListener)
                  collapsedPill.setOnTouchListener(dragListener)

                  windowManager.addView(controllerRoot, controllerParams)
              }

              private fun schedulePillAutoDim() {
                  tickerHandler.removeCallbacks(pillDimRunnable)
                  tickerHandler.postDelayed(pillDimRunnable, 3000L)
              }

              private inner class SubtitleLinesAdapter : BaseAdapter() {
                  override fun getCount(): Int = SubtitleRepository.activeCues.size
                  override fun getItem(position: Int): SubtitleCue = SubtitleRepository.activeCues[position]
                  override fun getItemId(position: Int): Long = position.toLong()

                  override fun getView(position: Int, convertView: View?, parent: ViewGroup?): View {
                      val tv = (convertView as? TextView) ?: TextView(this@FloatingSubtitleService).apply {
                          textSize = 11.5f
                          setPadding(dpToPx(10), dpToPx(7), dpToPx(10), dpToPx(7))
                      }
                      val cue = getItem(position)
                      val isCurrent = (position == lastActiveCueIdx)
                      tv.text = "${formatClock(cue.startMs)}   ${cue.primaryText}"
                      if (isCurrent) {
                          tv.setTextColor(Color.parseColor("#09090B"))
                          tv.setTypeface(null, Typeface.BOLD)
                          tv.background = GradientDrawable().apply {
                              cornerRadius = dpToPx(8).toFloat()
                              setColor(Color.parseColor("#F59E0B"))
                          }
                      } else {
                          tv.setTextColor(Color.parseColor("#E2E8F0"))
                          tv.setTypeface(null, Typeface.NORMAL)
                          tv.background = null
                      }
                      tv.setOnClickListener {
                          userScrollingUntilMs = 0L
                          seekToTimestamp(cue.startMs)
                          transcriptAdapter.notifyDataSetChanged()
                      }
                      return tv
                  }
              }

              private fun togglePlayPause() {
                  val now = SystemClock.elapsedRealtime()
                  if (isPlaying) {
                      val elapsed = now - anchorRealtimeMs
                      currentPlaybackMs = anchorPlaybackMs + (elapsed * activeSpeedMultiplier).toLong()
                      isPlaying = false
                      playPauseBtn.text = "PLAY"
                  } else {
                      anchorPlaybackMs = currentPlaybackMs
                      anchorRealtimeMs = now
                      isPlaying = true
                      playPauseBtn.text = "PAUSE"
                  }
              }

              private fun seekToTimestamp(targetMs: Long) {
                  currentPlaybackMs = targetMs.coerceAtLeast(0L)
                  anchorPlaybackMs = currentPlaybackMs
                  anchorRealtimeMs = SystemClock.elapsedRealtime()
              }

              private fun adjustSyncOffset(deltaMs: Long) {
                  syncOffsetMs += deltaMs
                  val sign = if (syncOffsetMs >= 0) "+" else ""
                  offsetLabel.text = "${sign}${"%.1f".format(syncOffsetMs / 1000.0)}s"
              }

              private fun toggleSubtitleTouchPassThrough() {
                  isPositionUnlocked = !isPositionUnlocked
                  subtitleView.isUnlockedForDrag = isPositionUnlocked
                  if (isPositionUnlocked) {
                      subtitleParams.flags = WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN
                      lockDragBtn.text = "Lock Pos"
                      lockDragBtn.setTextColor(Color.parseColor("#F59E0B"))
                  } else {
                      subtitleParams.flags = WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or
                          WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN
                      lockDragBtn.text = "Move Sub"
                      lockDragBtn.setTextColor(Color.WHITE)
                  }
                  windowManager.updateViewLayout(subtitleView, subtitleParams)
              }

              private fun createDeckButton(label: String, bgColor: Int, onClick: () -> Unit): Button {
