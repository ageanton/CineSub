      - name: Generate Universal Subtitle Parser & Charset Sniffer (SubtitleParser.kt)
        run: |
          cat << 'EOF' > android_app/app/src/main/java/com/cinesub/overlay/SubtitleParser.kt
          package com.cinesub.overlay

          import java.io.BufferedInputStream
          import java.io.InputStream
          import java.nio.charset.Charset

          data class SubtitleCue(
              val startMs: Long,
              val endMs: Long,
              val primaryText: String,
              val secondaryText: String = ""
          )

          object SubtitleRepository {
              var activeCues: List<SubtitleCue> = getDemoCues()
              var fileName: String = "Built-in Cinema Demo (.ASS)"
              var fontKey: String = "atkinson"
              var textSizeSp: Float = 22f
              var strokeWidthPx: Float = 9f
              var textColorHex: Int = 0xFFFFFFFF.toInt()
              var boxBgAlpha: Int = 135
              var fpsMultiplier: Double = 1.0

              fun getDemoCues(): List<SubtitleCue> = listOf(
                  SubtitleCue(0, 4500, "CineSub Pro Floating Player is Active!", "[Window A is 100% click-through — tap your video underneath freely]"),
                  SubtitleCue(4500, 9500, "Switch to Chrome, YouTube, or any video app now.", "[Use the Floating Deck to Play, Pause, Scrub, or Nudge Sync]"),
                  SubtitleCue(9500, 15000, "Hear a line in the video? Tap 'Lines' on the floating deck!", "[Tapping any spoken line snaps the monotonic clock to that exact moment]"),
                  SubtitleCue(15000, 22000, "Rendered with Atkinson Hyperlegible & Vector Edge Strokes.", "[Zero glare even over bright white explosions or daytime scenes]"),
                  SubtitleCue(22000, 30000, "Tap 'Lock/Drag' on the floating bar to reposition this box.", "[Collapse the floating player into a tiny 'CC' edge pill anytime]"),
                  SubtitleCue(30000, 45000, "Supports .SRT, .VTT, .ASS, .SSA, .SUB, .SBV & .LRC locally!", "[Load any downloaded subtitle file from your phone in the CineSub studio]")
              )
          }

          object SubtitleParser {

              fun readStreamWithCharsetDetection(input: InputStream): String {
                  val bis = BufferedInputStream(input)
                  val bytes = bis.readBytes()
                  if (bytes.size >= 3 &&
                      bytes[0] == 0xEF.toByte() &&
                      bytes[1] == 0xBB.toByte() &&
                      bytes[2] == 0xBF.toByte()
                  ) {
                      return String(bytes, 3, bytes.size - 3, Charsets.UTF_8)
                  }
                  if (bytes.size >= 2 && bytes[0] == 0xFF.toByte() && bytes[1] == 0xFE.toByte()) {
                      return String(bytes, 2, bytes.size - 2, Charsets.UTF_16LE)
                  }
                  if (bytes.size >= 2 && bytes[0] == 0xFE.toByte() && bytes[1] == 0xFF.toByte()) {
                      return String(bytes, 2, bytes.size - 2, Charsets.UTF_16BE)
                  }
                  val utf8Text = String(bytes, Charsets.UTF_8)
                  return if (utf8Text.contains('\uFFFD')) {
                      String(bytes, Charset.forName("windows-1252"))
                  } else {
                      utf8Text
                  }
              }

              private fun cleanMarkup(raw: String): String {
                  return raw
                      .replace(Regex("\\{[^}]*\\}"), "")
                      .replace(Regex("</?[^>]+(>|$)"), "")
                      .replace("\\N", "\n", ignoreCase = true)
                      .trim()
              }

              private fun parseTimestampMs(raw: String): Long {
                  val clean = raw.trim().replace(',', '.')
                  val parts = clean.split(':')
                  return try {
                      when (parts.size) {
                          3 -> {
                              val h = parts[0].toLong()
                              val m = parts[1].toLong()
                              val s = parts[2].toDouble()
                              ((h * 3600 + m * 60 + s) * 1000.0).toLong()
                          }
                          2 -> {
                              val m = parts[0].toLong()
                              val s = parts[1].toDouble()
                              ((m * 60 + s) * 1000.0).toLong()
                          }
                          else -> 0L
                      }
                  } catch (_: Exception) {
                      0L
                  }
              }

              fun parse(content: String, filename: String): List<SubtitleCue> {
                  val normalized = content.replace("\r\n", "\n").replace("\r", "\n")
                  val lines = normalized.split("\n")
                  val cues = mutableListOf<SubtitleCue>()
                  val lowerName = filename.lowercase()

                  // 1. ASS / SSA Advanced SubStation Alpha
                  if (lowerName.endsWith(".ass") || lowerName.endsWith(".ssa") || normalized.contains("[Events]")) {
                      for (line in lines) {
                          if (line.startsWith("Dialogue:")) {
                              val body = line.removePrefix("Dialogue:").trim()
                              val parts = body.split(",", limit = 10)
                              if (parts.size >= 10) {
                                  val start = parseTimestampMs(parts[1])
                                  val end = parseTimestampMs(parts[2])
                                  val textParts = cleanMarkup(parts[9]).split("\n").filter { it.isNotBlank() }
                                  if (textParts.isNotEmpty()) {
                                      cues.add(
                                          SubtitleCue(
                                              startMs = start,
                                              endMs = end,
                                              primaryText = textParts.first(),
                                              secondaryText = textParts.drop(1).joinToString(" ")
                                          )
                                      )
                                  }
                              }
                          }
                      }
                  }
                  // 2. MicroDVD .SUB ({startFrame}{endFrame}Line)
                  else if (lowerName.endsWith(".sub") && normalized.trimStart().startsWith("{")) {
                      val fps = 23.976
                      val regex = Regex("^\\{(\\d+)\\}\\{(\\d+)\\}(.*)$")
                      for (line in lines) {
                          val m = regex.find(line.trim()) ?: continue
                          val sFrame = m.groupValues[1].toLongOrNull() ?: continue
                          val eFrame = m.groupValues[2].toLongOrNull() ?: continue
                          val textParts = cleanMarkup(m.groupValues[3].replace("|", "\n")).split("\n").filter { it.isNotBlank() }
                          if (textParts.isNotEmpty()) {
                              cues.add(
                                  SubtitleCue(
                                      startMs = ((sFrame / fps) * 1000.0).toLong(),
                                      endMs = ((eFrame / fps) * 1000.0).toLong(),
                                      primaryText = textParts.first(),
                                      secondaryText = textParts.drop(1).joinToString(" ")
                                  )
                              )
                          }
                      }
                  }
                  // 3. LRC Synchronized Captions
                  else if (lowerName.endsWith(".lrc")) {
                      val regex = Regex("^\\[(\\d{2}:\\d{2}\\.\\d{2,3})\\](.*)$")
                      val rawList = mutableListOf<Pair<Long, String>>()
                      for (line in lines) {
                          val m = regex.find(line.trim()) ?: continue
                          val start = parseTimestampMs(m.groupValues[1])
                          val txt = cleanMarkup(m.groupValues[2])
                          if (txt.isNotEmpty()) rawList.add(start to txt)
                      }
                      for (i in rawList.indices) {
                          val start = rawList[i].first
                          val end = if (i + 1 < rawList.size) rawList[i + 1].first else start + 4000L
                          cues.add(SubtitleCue(start, end, rawList[i].second))
                      }
                  }
                  // 4. SRT / WebVTT (.vtt) / YouTube (.sbv)
                  else {
                      val blocks = normalized.split(Regex("\n\\s*\n"))
                      for (block in blocks) {
                          val bLines = block.trim().split("\n")
                          if (bLines.isEmpty()) continue
                          val timeLineIdx = bLines.indexOfFirst {
                              it.contains("-->") || it.matches(Regex("^\\d+:\\d+:\\d+\\.\\d+,\\d+:\\d+:\\d+\\.\\d+$"))
                          }
                          if (timeLineIdx != -1) {
                              val tLine = bLines[timeLineIdx]
                              val delimiter = if (tLine.contains("-->")) "-->" else ","
                              val parts = tLine.split(delimiter)
                              if (parts.size >= 2) {
                                  val start = parseTimestampMs(parts[0].trim().split(" ")[0])
                                  val end = parseTimestampMs(parts[1].trim().split(" ")[0])
                                  val textLines = bLines.drop(timeLineIdx + 1).map { cleanMarkup(it) }.filter { it.isNotBlank() }
                                  if (textLines.isNotEmpty()) {
                                      cues.add(
                                          SubtitleCue(
                                              startMs = start,
                                              endMs = end,
                                              primaryText = textLines.first(),
                                              secondaryText = textLines.drop(1).joinToString(" ")
                                          )
                                      )
                                  }
                              }
                          }
                      }
                  }

                  return cues.sortedBy { it.startMs }
              }

              fun findActiveCueBinarySearch(cues: List<SubtitleCue>, currentMs: Long): SubtitleCue? {
                  var low = 0
                  var high = cues.size - 1
                  while (low <= high) {
                      val mid = (low + high) ushr 1
                      val cue = cues[mid]
                      if (currentMs in cue.startMs..cue.endMs) {
                          return cue
                      } else if (currentMs < cue.startMs) {
                          high = mid - 1
                      } else {
                          low = mid + 1
                      }
                  }
                  return null
              }
          }
          EOF

      - name: Generate Custom Cinema Outlined Subtitle Canvas View (StrokedSubtitleView.kt)
        run: |
          cat << 'EOF' > android_app/app/src/main/java/com/cinesub/overlay/StrokedSubtitleView.kt
          package com.cinesub.overlay

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.RectF
          import android.graphics.Typeface
          import android.text.Layout
          import android.text.StaticLayout
          import android.text.TextPaint
          import android.util.TypedValue
          import android.view.View

          class StrokedSubtitleView(context: Context) : View(context) {

              private val fillPaint = TextPaint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.FILL
                  color = Color.WHITE
              }

              private val strokePaint = TextPaint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.STROKE
                  strokeJoin = Paint.Join.ROUND
                  strokeCap = Paint.Cap.ROUND
                  color = Color.BLACK
                  strokeWidth = 9f
              }

              private val bgPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.FILL
                  color = Color.argb(135, 8, 8, 12)
              }

              private val borderPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.STROKE
                  strokeWidth = 3f
                  color = Color.TRANSPARENT
              }

              private val bgRect = RectF()
              private var primaryText: String = ""
              private var secondaryText: String = ""
              var isUnlockedForDrag: Boolean = false
                  set(value) {
                      field = value
                      borderPaint.color = if (value) Color.parseColor("#F59E0B") else Color.TRANSPARENT
                      invalidate()
                  }

              fun updateSubtitle(primary: String, secondary: String) {
                  if (primaryText == primary && secondaryText == secondary) return
                  primaryText = primary
                  secondaryText = secondary
                  requestLayout()
                  invalidate()
              }

              fun applyStyleFromRepo(context: Context) {
                  val tf = loadCinemaTypeface(context, SubtitleRepository.fontKey)
                  fillPaint.typeface = tf
                  strokePaint.typeface = tf

                  val px = TypedValue.applyDimension(
                      TypedValue.COMPLEX_UNIT_SP,
                      SubtitleRepository.textSizeSp,
                      resources.displayMetrics
                  )
                  fillPaint.textSize = px
                  strokePaint.textSize = px
                  fillPaint.color = SubtitleRepository.textColorHex
                  strokePaint.strokeWidth = SubtitleRepository.strokeWidthPx
                  bgPaint.color = Color.argb(SubtitleRepository.boxBgAlpha, 8, 8, 12)
                  requestLayout()
                  invalidate()
              }

              private fun loadCinemaTypeface(context: Context, key: String): Typeface {
                  val assetPath = when (key) {
                      "atkinson" -> "fonts/atkinson_hyperlegible_bold.ttf"
                      "cinesans" -> "fonts/cinesans_bold.ttf"
                      "mono" -> "fonts/dm_mono_medium.ttf"
                      "serif" -> "fonts/cinema_serif_bold.ttf"
                      else -> null
                  }
                  if (assetPath != null) {
                      try {
                          return Typeface.createFromAsset(context.assets, assetPath)
                      } catch (_: Exception) {}
                  }
                  return Typeface.create(Typeface.SANS_SERIF, Typeface.BOLD)
              }

              override fun onMeasure(widthMeasureSpec: Int, heightMeasureSpec: Int) {
                  val maxWidth = MeasureSpec.getSize(widthMeasureSpec).coerceAtLeast(320) - 48
                  val combined = if (secondaryText.isNotBlank()) "$primaryText\n$secondaryText" else primaryText
                  if (combined.isBlank()) {
                      setMeasuredDimension(maxWidth + 48, 80)
                      return
                  }
                  val layout = StaticLayout.Builder
                      .obtain(combined, 0, combined.length, fillPaint, maxWidth)
                      .setAlignment(Layout.Alignment.ALIGN_CENTER)
                      .setLineSpacing(4f, 1.05f)
                      .build()

                  val desiredH = (layout.height + 44).coerceAtLeast(76)
                  setMeasuredDimension(maxWidth + 48, desiredH)
              }

              override fun onDraw(canvas: Canvas) {
                  super.onDraw(canvas)
                  val combined = if (secondaryText.isNotBlank()) "$primaryText\n$secondaryText" else primaryText
                  if (combined.isBlank() && !isUnlockedForDrag) return

                  val textToRender = if (combined.isBlank()) "✋ Drag Subtitle Position Here" else combined
                  val availWidth = (width - 48).coerceAtLeast(200)

                  val strokeLayout = StaticLayout.Builder
                      .obtain(textToRender, 0, textToRender.length, strokePaint, availWidth)
                      .setAlignment(Layout.Alignment.ALIGN_CENTER)
                      .setLineSpacing(4f, 1.05f)
                      .build()

                  val fillLayout = StaticLayout.Builder
                      .obtain(textToRender, 0, textToRender.length, fillPaint, availWidth)
                      .setAlignment(Layout.Alignment.ALIGN_CENTER)
                      .setLineSpacing(4f, 1.05f)
                      .build()

                  var maxLineWidth = 0f
                  for (i in 0 until fillLayout.lineCount) {
                      maxLineWidth = maxOf(maxLineWidth, fillLayout.getLineWidth(i))
                  }

                  val boxW = (maxLineWidth + 48f).coerceAtMost(width.toFloat())
                  val left = (width - boxW) / 2f
                  bgRect.set(left, 6f, left + boxW, height - 6f)

                  canvas.drawRoundRect(bgRect, 28f, 28f, bgPaint)
                  if (isUnlockedForDrag) {
                      canvas.drawRoundRect(bgRect, 28f, 28f, borderPaint)
                  }

                  canvas.save()
                  canvas.translate(24f, 20f)
                  if (SubtitleRepository.strokeWidthPx > 0.5f) {
                      strokeLayout.draw(canvas)
                  }
                  fillLayout.draw(canvas)
                  canvas.restore()
              }
          }
          EOF

      - name: Generate Dual-Window Floating Subtitle Service (FloatingSubtitleService.kt)
        run: |
          cat << 'EOF' > android_app/app/src/main/java/com/cinesub/overlay/FloatingSubtitleService.kt
          package com.cinesub.overlay

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Intent
          import android.content.res.Configuration
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.os.Build
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.os.SystemClock
          import android.util.TypedValue
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import android.widget.Button
          import android.widget.FrameLayout
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.SeekBar
          import android.widget.TextView
          import kotlin.math.abs

          class FloatingSubtitleService : Service() {

              companion object {
                  const val ACTION_REFRESH_STYLE = "com.cinesub.overlay.REFRESH_STYLE"
                  const val ACTION_STOP_OVERLAY = "com.cinesub.overlay.STOP_OVERLAY"
                  var isRunning = false
              }

              private lateinit var windowManager: WindowManager
              private lateinit var subtitleView: StrokedSubtitleView
              private lateinit var subtitleParams: WindowManager.LayoutParams

              private lateinit var controllerRoot: FrameLayout
              private lateinit var controllerParams: WindowManager.LayoutParams
              private lateinit var expandedDeck: LinearLayout
              private lateinit var collapsedPill: TextView
              private lateinit var timeLabel: TextView
              private lateinit var offsetLabel: TextView
              private lateinit var playPauseBtn: Button
              private lateinit var lockDragBtn: Button
              private lateinit var scrubber: SeekBar
              private lateinit var transcriptDrawer: ScrollView
              private lateinit var transcriptContainer: LinearLayout

              private val tickerHandler = Handler(Looper.getMainLooper())
              private var isPlaying = true
              private var anchorRealtimeMs = 0L
              private var anchorPlaybackMs = 0L
              private var currentPlaybackMs = 0L
              private var syncOffsetMs = 0L
              private var isPositionUnlocked = false
              private var isTranscriptOpen = false

              private val frameTicker = object : Runnable {
                  override fun run() {
                      if (isPlaying) {
                          val elapsed = SystemClock.elapsedRealtime() - anchorRealtimeMs
                          currentPlaybackMs = anchorPlaybackMs + (elapsed * SubtitleRepository.fpsMultiplier).toLong()
                      }
                      val effectiveMs = (currentPlaybackMs + syncOffsetMs).coerceAtLeast(0L)
                      val activeCue = SubtitleParser.findActiveCueBinarySearch(SubtitleRepository.activeCues, effectiveMs)

                      if (activeCue != null) {
                          subtitleView.updateSubtitle(activeCue.primaryText, activeCue.secondaryText)
                      } else {
                          subtitleView.updateSubtitle("", "")
                      }

                      timeLabel.text = formatClock(effectiveMs)
                      val maxDuration = SubtitleRepository.activeCues.lastOrNull()?.endMs?.coerceAtLeast(1000L) ?: 60000L
                      scrubber.max = maxDuration.toInt()
                      scrubber.progress = effectiveMs.coerceAtMost(maxDuration).toInt()

                      tickerHandler.postDelayed(this, 45L)
                  }
              }

              override fun onCreate() {
                  super.onCreate()
                  isRunning = true
                  windowManager = getSystemService(WINDOW_SERVICE) as WindowManager
                  startForegroundWithNotification()
                  setupWindowASubtitleOverlay()
                  setupWindowBControllerOverlay()

                  anchorRealtimeMs = SystemClock.elapsedRealtime()
                  anchorPlaybackMs = 0L
                  tickerHandler.post(frameTicker)
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  when (intent?.action) {
                      ACTION_STOP_OVERLAY -> {
                          stopSelf()
                          return START_NOT_STICKY
                      }
                      ACTION_REFRESH_STYLE -> {
                          subtitleView.applyStyleFromRepo(this)
                          rebuildTranscriptRows()
                      }
                  }
                  return START_STICKY
              }

              private fun setupWindowASubtitleOverlay() {
                  subtitleView = StrokedSubtitleView(this)
                  subtitleView.applyStyleFromRepo(this)

                  val overlayType = WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                  subtitleParams = WindowManager.LayoutParams(
                      (resources.displayMetrics.widthPixels * 0.90).toInt(),
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      overlayType,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or
                          WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.BOTTOM or Gravity.CENTER_HORIZONTAL
                      y = dpToPx(88)
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                          layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES
                      }
                  }

                  subtitleView.setOnTouchListener(object : View.OnTouchListener {
                      private var startRawY = 0f
                      private var startParamY = 0
                      override fun onTouch(v: View, event: MotionEvent): Boolean {
                          if (!isPositionUnlocked) return false
                          when (event.actionMasked) {
                              MotionEvent.ACTION_DOWN -> {
                                  startRawY = event.rawY
                                  startParamY = subtitleParams.y
                                  return true
                              }
                              MotionEvent.ACTION_MOVE -> {
                                  val deltaY = (startRawY - event.rawY).toInt()
                                  subtitleParams.y = (startParamY + deltaY).coerceIn(dpToPx(24), resources.displayMetrics.heightPixels - dpToPx(140))
                                  windowManager.updateViewLayout(subtitleView, subtitleParams)
                                  return true
                              }
                          }
                          return false
                      }
                  })

                  windowManager.addView(subtitleView, subtitleParams)
              }

              private fun setupWindowBControllerOverlay() {
                  controllerRoot = FrameLayout(this)

                  // 1. Collapsed Edge Pill ("CC")
                  collapsedPill = TextView(this).apply {
                      text = "CC"
                      setTextColor(Color.parseColor("#09090B"))
                      setTypeface(typeface, Typeface.BOLD)
                      textSize = 14f
                      gravity = Gravity.CENTER
                      background = GradientDrawable().apply {
                          shape = GradientDrawable.OVAL
                          setColor(Color.parseColor("#F59E0B"))
                          setStroke(dpToPx(2), Color.WHITE)
                      }
                      visibility = View.GONE
                  }

                  // 2. Expanded Floating Subtitle Player Deck
                  expandedDeck = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dpToPx(14), dpToPx(12), dpToPx(14), dpToPx(12))
                      background = GradientDrawable().apply {
                          cornerRadius = dpToPx(20).toFloat()
                          setColor(Color.argb(232, 14, 15, 22))
                          setStroke(dpToPx(1), Color.argb(55, 255, 255, 255))
                      }
                  }

                  // Header Row (Drag Handle + Title + Collapse + Close)
                  val headerRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                  }

                  val titleTv = TextView(this).apply {
                      text = "⠿ CineSub Deck"
                      setTextColor(Color.WHITE)
                      textSize = 13f
                      setTypeface(typeface, Typeface.BOLD)
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                  }

                  offsetLabel = TextView(this).apply {
                      text = "+0.0s"
                      setTextColor(Color.parseColor("#F59E0B"))
                      textSize = 11f
                      setPadding(dpToPx(6), 0, dpToPx(8), 0)
                  }

                  val minimizeBtn = createCompactButton("⎯") {
                      expandedDeck.visibility = View.GONE
                      collapsedPill.visibility = View.VISIBLE
                  }

                  val closeBtn = createCompactButton("✕") {
                      stopSelf()
                  }

                  headerRow.addView(titleTv)
                  headerRow.addView(offsetLabel)
                  headerRow.addView(minimizeBtn)
                  headerRow.addView(closeBtn)

                  // Scrubber + Timestamp Row
                  val scrubRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(0, dpToPx(8), 0, dpToPx(6))
                  }

                  timeLabel = TextView(this).apply {
                      text = "00:00.0"
                      setTextColor(Color.parseColor("#F59E0B"))
                      textSize = 11f
                      typeface = Typeface.MONOSPACE
                  }

                  scrubber = SeekBar(this).apply {
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                      setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                          override fun onProgressChanged(sb: SeekBar?, progress: Int, fromUser: Boolean) {
                              if (fromUser) seekToTimestamp(progress.toLong() - syncOffsetMs)
                          }
                          override fun onStartTrackingTouch(sb: SeekBar?) {}
                          override fun onStopTrackingTouch(sb: SeekBar?) {}
                      })
                  }

                  scrubRow.addView(timeLabel)
                  scrubRow.addView(scrubber)

                  // Transport Controls Row (-0.5s, Play/Pause, +0.5s, Lines, Lock/Drag)
                  val transportRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER
                  }

                  val nudgeBackBtn = createCompactButton("-0.5s") { adjustSyncOffset(-500L) }
                  playPauseBtn = createCompactButton("⏸") { togglePlayPause() }.apply {
                      setTextColor(Color.parseColor("#F59E0B"))
                  }
                  val nudgeFwdBtn = createCompactButton("+0.5s") { adjustSyncOffset(500L) }
                  val linesBtn = createCompactButton("Lines") {
                      isTranscriptOpen = !isTranscriptOpen
                      transcriptDrawer.visibility = if (isTranscriptOpen) View.VISIBLE else View.GONE
                  }
                  lockDragBtn = createCompactButton("🔒 Pos") {
                      toggleSubtitleTouchPassThrough()
                  }

                  transportRow.addView(nudgeBackBtn)
                  transportRow.addView(playPauseBtn)
                  transportRow.addView(nudgeFwdBtn)
                  transportRow.addView(linesBtn)
                  transportRow.addView(lockDragBtn)

                  // Tap-to-Sync Line Picker Drawer
                  transcriptDrawer = ScrollView(this).apply {
                      visibility = View.GONE
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          dpToPx(150)
                      ).apply { topMargin = dpToPx(8) }
                  }
                  transcriptContainer = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                  }
                  transcriptDrawer.addView(transcriptContainer)
                  rebuildTranscriptRows()

                  expandedDeck.addView(headerRow)
                  expandedDeck.addView(scrubRow)
                  expandedDeck.addView(transportRow)
                  expandedDeck.addView(transcriptDrawer)

                  controllerRoot.addView(expandedDeck)
                  controllerRoot.addView(collapsedPill, FrameLayout.LayoutParams(dpToPx(48), dpToPx(48)))

                  controllerParams = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.END
                      x = dpToPx(16)
                      y = dpToPx(90)
                  }

                  val dragListener = object : View.OnTouchListener {
                      private var initialX = 0
                      private var initialY = 0
                      private var touchX = 0f
                      private var touchY = 0f
                      override fun onTouch(v: View, event: MotionEvent): Boolean {
                          when (event.actionMasked) {
                              MotionEvent.ACTION_DOWN -> {
                                  initialX = controllerParams.x
                                  initialY = controllerParams.y
                                  touchX = event.rawX
                                  touchY = event.rawY
                                  return true
                              }
                              MotionEvent.ACTION_MOVE -> {
                                  controllerParams.x = (initialX - (event.rawX - touchX)).toInt()
                                  controllerParams.y = (initialY + (event.rawY - touchY)).toInt()
                                  windowManager.updateViewLayout(controllerRoot, controllerParams)
                                  return true
                              }
                              MotionEvent.ACTION_UP -> {
                                  if (abs(event.rawX - touchX) < 12 && abs(event.rawY - touchY) < 12) {
                                      if (v == collapsedPill) {
                                          collapsedPill.visibility = View.GONE
                                          expandedDeck.visibility = View.VISIBLE
                                      }
                                  }
                                  return true
                              }
                          }
                          return false
                      }
                  }

                  headerRow.setOnTouchListener(dragListener)
                  collapsedPill.setOnTouchListener(dragListener)

                  windowManager.addView(controllerRoot, controllerParams)
              }

              private fun rebuildTranscriptRows() {
                  if (!::transcriptContainer.isInitialized) return
                  transcriptContainer.removeAllViews()
                  SubtitleRepository.activeCues.take(120).forEach { cue ->
                      val row = TextView(this).apply {
                          text = "${formatClock(cue.startMs)}  ${cue.primaryText}"
                          setTextColor(Color.parseColor("#E2E8F0"))
                          textSize = 11.5f
                          setPadding(dpToPx(8), dpToPx(6), dpToPx(8), dpToPx(6))
                          setOnClickListener {
                              seekToTimestamp(cue.startMs)
                          }
                      }
                      transcriptContainer.addView(row)
                  }
              }

              private fun togglePlayPause() {
                  isPlaying = !isPlaying
                  if (isPlaying) {
                      anchorPlaybackMs = currentPlaybackMs
                      anchorRealtimeMs = SystemClock.elapsedRealtime()
                      playPauseBtn.text = "⏸"
                  } else {
                      playPauseBtn.text = "▶"
                  }
              }

              private fun seekToTimestamp(targetMs: Long) {
                  currentPlaybackMs = targetMs.coerceAtLeast(0L)
                  anchorPlaybackMs = currentPlaybackMs
                  anchorRealtimeMs = SystemClock.elapsedRealtime()
              }

              private fun adjustSyncOffset(deltaMs: Long) {
                  syncOffsetMs += deltaMs
                  val sign = if (syncOffsetMs >= 0) "+" else ""
                  offsetLabel.text = "${sign}${"%.1f".format(syncOffsetMs / 1000.0)}s"
              }

              private fun toggleSubtitleTouchPassThrough() {
                  isPositionUnlocked = !isPositionUnlocked
                  subtitleView.isUnlockedForDrag = isPositionUnlocked
                  if (isPositionUnlocked) {
                      subtitleParams.flags = WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN
                      lockDragBtn.text = "✋ Drag"
                      lockDragBtn.setTextColor(Color.parseColor("#F59E0B"))
                  } else {
                      subtitleParams.flags = WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or
                          WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN
                      lockDragBtn.text = "🔒 Pos"
                      lockDragBtn.setTextColor(Color.WHITE)
                  }
                  windowManager.updateViewLayout(subtitleView, subtitleParams)
              }

              private fun createCompactButton(label: String, onClick: () -> Unit): Button {
                  return Button(this).apply {
                      text = label
                      isAllCaps = false
                      textSize = 11f
                      setTextColor(Color.WHITE)
                      minWidth = 0
                      minimumWidth = 0
                      minHeight = 0
                      minimumHeight = 0
                      setPadding(dpToPx(9), dpToPx(6), dpToPx(9), dpToPx(6))
                      background = GradientDrawable().apply {
                          cornerRadius = dpToPx(10).toFloat()
                          setColor(Color.argb(38, 255, 255, 255))
                      }
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.WRAP_CONTENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      ).apply {
                          marginEnd = dpToPx(4)
                      }
                      setOnClickListener { onClick() }
                  }
              }

              override fun onConfigurationChanged(newConfig: Configuration) {
                  super.onConfigurationChanged(newConfig)
                  if (::subtitleView.isInitialized) {
                      subtitleParams.width = (resources.displayMetrics.widthPixels * 0.90).toInt()
                      windowManager.updateViewLayout(subtitleView, subtitleParams)
                  }
              }

              private fun startForegroundWithNotification() {
                  val channelId = "cinesub_overlay_channel"
                  val nm = getSystemService(NOTIFICATION_SERVICE) as NotificationManager
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val ch = NotificationChannel(
                          channelId,
                          "CineSub Floating Subtitle Engine",
                          NotificationManager.IMPORTANCE_LOW
                      )
                      nm.createNotificationChannel(ch)
                  }

                  val stopIntent = Intent(this, FloatingSubtitleService::class.java).apply {
                      action = ACTION_STOP_OVERLAY
                  }
                  val stopPending = PendingIntent.getService(
                      this, 1, stopIntent,
                      PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                  )

                  val openAppIntent = Intent(this, MainActivity::class.java)
                  val openPending = PendingIntent.getActivity(
                      this, 2, openAppIntent,
                      PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                  )

                  val notif = Notification.Builder(this, channelId)
                      .setContentTitle("CineSub Floating Subtitles Active")
                      .setContentText("Track: ${SubtitleRepository.fileName}")
                      .setSmallIcon(android.R.drawable.ic_media_play)
                      .setContentIntent(openPending)
                      .addAction(Notification.Action.Builder(null, "Stop Overlay", stopPending).build())
                      .setOngoing(true)
                      .build()

                  startForeground(1001, notif)
              }

              private fun formatClock(ms: Long): String {
                  val totalSec = (ms / 1000L).coerceAtLeast(0L)
                  val m = totalSec / 60L
                  val s = totalSec % 60L
                  val tenths = (ms % 1000L) / 100L
                  return "%02d:%02d.%d".format(m, s, tenths)
              }

              private fun dpToPx(dp: Int): Int {
                  return TypedValue.applyDimension(
                      TypedValue.COMPLEX_UNIT_DIP,
                      dp.toFloat(),
                      resources.displayMetrics
                  ).toInt()
              }

              override fun onDestroy() {
                  isRunning = false
                  tickerHandler.removeCallbacksAndMessages(null)
                  if (::subtitleView.isInitialized) {
                      try { windowManager.removeView(subtitleView) } catch (_: Exception) {}
                  }
                  if (::controllerRoot.isInitialized) {
                      try { windowManager.removeView(controllerRoot) } catch (_: Exception) {}
                  }
                  super.onDestroy()
              }

              override fun onBind(intent: Intent?): IBinder? = null
          }
          EOF

      - name: Generate Infuse-Inspired Studio Dashboard Activity (MainActivity.kt)
        run: |
          cat << 'EOF' > android_app/app/src/main/java/com/cinesub/overlay/MainActivity.kt
          package com.cinesub.overlay

          import android.content.Intent
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.PowerManager
          import android.provider.OpenableColumns
          import android.provider.Settings
          import android.util.TypedValue
          import android.view.Gravity
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.SeekBar
          import android.widget.TextView
          import android.widget.Toast
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {

              private lateinit var statusBadge: TextView
              private lateinit var activeFileTv: TextView
              private lateinit var previewSubView: StrokedSubtitleView

              private val subtitleFileLauncher = registerForActivityResult(
                  ActivityResultContracts.OpenDocument()
              ) { uri: Uri? ->
                  if (uri != null) {
                      loadSubtitleFromUri(uri)
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.statusBarColor = Color.parseColor("#08080C")
                  window.navigationBarColor = Color.parseColor("#08080C")

                  val rootScroll = ScrollView(this).apply {
                      setBackgroundColor(Color.parseColor("#08080C"))
                      isFillViewport = true
                  }

                  val container = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(20), dp(24), dp(20), dp(40))
                  }

                  // Top Brand Header
                  val headerTitle = TextView(this).apply {
                      text = "CineSub Pro"
                      setTextColor(Color.WHITE)
                      textSize = 28f
                      setTypeface(typeface, Typeface.BOLD)
                  }
                  val headerSub = TextView(this).apply {
                      text = "Floating Subtitle Player • Dual-Window Click-Through Engine"
                      setTextColor(Color.parseColor("#94A3B8"))
                      textSize = 13f
                      setPadding(0, dp(4), 0, dp(18))
                  }
                  container.addView(headerTitle)
                  container.addView(headerSub)

                  // CARD 1: System Overlay & Battery Guard Wizard
                  val permCard = createGlassCard()
                  permCard.addView(createSectionLabel("1. ANDROID OVERLAY & SURVIVAL PERMISSIONS"))

                  statusBadge = TextView(this).apply {
                      textSize = 13f
                      setPadding(0, dp(6), 0, dp(10))
                  }
                  permCard.addView(statusBadge)

                  val permRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                  }
                  val grantOverlayBtn = createAccentButton("Grant Overlay Permission", "#334155", "#FFFFFF") {
                      if (!Settings.canDrawOverlays(this)) {
                          val intent = Intent(
                              Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                              Uri.parse("package:$packageName")
                          )
                          startActivity(intent)
                      } else {
                          Toast.makeText(this, "Overlay Permission Already Granted!", Toast.LENGTH_SHORT).show()
                      }
                  }.apply {
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f).apply {
                          marginEnd = dp(8)
                      }
                  }

                  val batteryBtn = createAccentButton("Unrestrict Battery", "#1E293B", "#CBD5E1") {
                      val pm = getSystemService(POWER_SERVICE) as PowerManager
                      if (!pm.isIgnoringBatteryOptimizations(packageName)) {
                          val i = Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS).apply {
                              data = Uri.parse("package:$packageName")
                          }
                          startActivity(i)
                      } else {
                          Toast.makeText(this, "Battery Unrestricted!", Toast.LENGTH_SHORT).show()
                      }
                  }.apply {
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                  }

                  permRow.addView(grantOverlayBtn)
                  permRow.addView(batteryBtn)
                  permCard.addView(permRow)
                  container.addView(permCard)

                  // CARD 2: Multi-Format Local Subtitle Picker
                  val fileCard = createGlassCard()
                  fileCard.addView(createSectionLabel("2. UNIVERSAL SUBTITLE LOADER (.SRT .VTT .ASS .SSA .SUB .SBV .LRC)"))

                  activeFileTv = TextView(this).apply {
                      text = "Loaded: ${SubtitleRepository.fileName} (${SubtitleRepository.activeCues.size} cues)"
                      setTextColor(Color.parseColor("#F59E0B"))
                      textSize = 13.5f
                      setTypeface(typeface, Typeface.BOLD)
                      setPadding(0, dp(6), 0, dp(12))
                  }
                  fileCard.addView(activeFileTv)

                  val pickFileBtn = createAccentButton("📂 Load Local Subtitle File", "#F59E0B", "#09090B") {
                      subtitleFileLauncher.launch(arrayOf("*/*"))
                  }
                  fileCard.addView(pickFileBtn)
                  container.addView(fileCard)

                  // CARD 3: Live Subtitle Preview & Dedicated Subtitle Fonts
                  val styleCard = createGlassCard()
                  styleCard.addView(createSectionLabel("3. CINEMA TYPOGRAPHY & ANTI-GLARE STUDIO"))

                  previewSubView = StrokedSubtitleView(this).apply {
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          dp(96)
                      ).apply {
                          topMargin = dp(8)
                          bottomMargin = dp(12)
                      }
                      applyStyleFromRepo(this@MainActivity)
                      updateSubtitle("The quick brown fox jumps over the lazy dog.", "[Live Cinema Font & Stroke Preview]")
                  }
                  styleCard.addView(previewSubView)

                  // Font Selector Chips
                  val fontRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      setPadding(0, 0, 0, dp(12))
                  }
                  val fonts = listOf(
                      "atkinson" to "Atkinson",
                      "cinesans" to "CineSans",
                      "serif" to "Criterion",
                      "mono" to "SDH Mono"
                  )
                  fonts.forEach { (key, label) ->
                      val btn = createAccentButton(label, "#1E293B", "#F8FAFC") {
                          SubtitleRepository.fontKey = key
                          refreshLiveStyle()
                      }.apply {
                          layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f).apply {
                              marginEnd = dp(6)
                          }
                      }
                      fontRow.addView(btn)
                  }
                  styleCard.addView(fontRow)

                  // Font Size Slider
                  val sizeLabel = TextView(this).apply {
                      text = "Subtitle Size: ${SubtitleRepository.textSizeSp.toInt()}sp"
                      setTextColor(Color.WHITE)
                      textSize = 12.5f
                  }
                  val sizeSeek = SeekBar(this).apply {
                      max = 38
                      progress = SubtitleRepository.textSizeSp.toInt()
                      setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                          override fun onProgressChanged(s: SeekBar?, p: Int, fromUser: Boolean) {
                              val sz = p.coerceAtLeast(14).toFloat()
                              SubtitleRepository.textSizeSp = sz
                              sizeLabel.text = "Subtitle Size: ${sz.toInt()}sp"
                              refreshLiveStyle()
                          }
                          override fun onStartTrackingTouch(s: SeekBar?) {}
                          override fun onStopTrackingTouch(s: SeekBar?) {}
                      })
                  }
                  styleCard.addView(sizeLabel)
                  styleCard.addView(sizeSeek)

                  // Vector Stroke Thickness Slider
                  val strokeLabel = TextView(this).apply {
                      text = "Vector Outline Stroke: ${SubtitleRepository.strokeWidthPx.toInt()}px"
                      setTextColor(Color.WHITE)
                      textSize = 12.5f
                      setPadding(0, dp(8), 0, 0)
                  }
                  val strokeSeek = SeekBar(this).apply {
                      max = 18
                      progress = SubtitleRepository.strokeWidthPx.toInt()
                      setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                          override fun onProgressChanged(s: SeekBar?, p: Int, fromUser: Boolean) {
                              SubtitleRepository.strokeWidthPx = p.toFloat()
                              strokeLabel.text = "Vector Outline Stroke: ${p}px"
                              refreshLiveStyle()
                          }
                          override fun onStartTrackingTouch(s: SeekBar?) {}
                          override fun onStopTrackingTouch(s: SeekBar?) {}
                      })
                  }
                  styleCard.addView(strokeLabel)
                  styleCard.addView(strokeSeek)

                  // Color Swatch Row
                  val colorRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      setPadding(0, dp(12), 0, 0)
                  }
                  val colors = listOf(
                      "White" to Color.WHITE,
                      "Cinema Yellow" to Color.parseColor("#FACC15"),
                      "Cyan" to Color.parseColor("#38BDF8"),
                      "Soft Green" to Color.parseColor("#4ADE80")
                  )
                  colors.forEach { (name, col) ->
                      val cBtn = createAccentButton(name, "#1E293B", "#FFFFFF") {
                          SubtitleRepository.textColorHex = col
                          refreshLiveStyle()
                      }.apply {
                          setTextColor(col)
                          layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f).apply {
                              marginEnd = dp(6)
                          }
                      }
                      colorRow.addView(cBtn)
                  }
                  styleCard.addView(colorRow)
                  container.addView(styleCard)

                  // LAUNCH / STOP FLOATING PLAYER CTA
                  val launchBtn = createAccentButton("🚀 Launch Floating Subtitle Player", "#F59E0B", "#09090B") {
                      if (!Settings.canDrawOverlays(this)) {
                          Toast.makeText(this, "Please grant 'Draw Over Other Apps' permission first!", Toast.LENGTH_LONG).show()
                          val intent = Intent(
                              Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                              Uri.parse("package:$packageName")
                          )
                          startActivity(intent)
                      } else {
                          val serviceIntent = Intent(this, FloatingSubtitleService::class.java)
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                              startForegroundService(serviceIntent)
                          } else {
                              startService(serviceIntent)
                          }
                          Toast.makeText(this, "Floating Player Active! Switch to your video app.", Toast.LENGTH_LONG).show()
                      }
                  }.apply {
                      textSize = 15f
                      setPadding(dp(16), dp(16), dp(16), dp(16))
                  }
                  container.addView(launchBtn)

                  val stopBtn = createAccentButton("⏹ Stop Floating Player", "#1E293B", "#F87171") {
                      stopService(Intent(this, FloatingSubtitleService::class.java))
                      Toast.makeText(this, "Floating Subtitle Overlay Stopped", Toast.LENGTH_SHORT).show()
                  }.apply {
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      ).apply { topMargin = dp(10) }
                  }
                  container.addView(stopBtn)

                  rootScroll.addView(container)
                  setContentView(rootScroll)
              }

              override fun onResume() {
                  super.onResume()
                  val hasOverlay = Settings.canDrawOverlays(this)
                  statusBadge.text = if (hasOverlay) {
                      "✅ Overlay Permission Ready — You can launch over any video app"
                  } else {
                      "⚠️ Step 1 Required: Grant 'Draw over other apps' permission below"
                  }
                  statusBadge.setTextColor(
                      if (hasOverlay) Color.parseColor("#10B981") else Color.parseColor("#F59E0B")
                  )
              }

              private fun loadSubtitleFromUri(uri: Uri) {
                  try {
                      var displayName = "Custom_Subtitles.srt"
                      contentResolver.query(uri, null, null, null, null)?.use { cursor ->
                          val nameIndex = cursor.getColumnIndex(OpenableColumns.DISPLAY_NAME)
                          if (cursor.moveToFirst() && nameIndex >= 0) {
                              displayName = cursor.getString(nameIndex)
                          }
                      }
                      contentResolver.openInputStream(uri)?.use { stream ->
                          val text = SubtitleParser.readStreamWithCharsetDetection(stream)
                          val parsed = SubtitleParser.parse(text, displayName)
                          if (parsed.isNotEmpty()) {
                              SubtitleRepository.activeCues = parsed
                              SubtitleRepository.fileName = displayName
                              activeFileTv.text = "Loaded: $displayName (${parsed.size} cues)"
                              refreshLiveStyle()
                              Toast.makeText(this, "Loaded ${parsed.size} subtitle lines!", Toast.LENGTH_SHORT).show()
                          } else {
                              Toast.makeText(this, "No valid subtitle timestamps found in file.", Toast.LENGTH_LONG).show()
                          }
                      }
                  } catch (e: Exception) {
                      Toast.makeText(this, "Error reading file: ${e.message}", Toast.LENGTH_LONG).show()
                  }
              }

              private fun refreshLiveStyle() {
                  previewSubView.applyStyleFromRepo(this)
                  if (FloatingSubtitleService.isRunning) {
                      val intent = Intent(this, FloatingSubtitleService::class.java).apply {
                          action = FloatingSubtitleService.ACTION_REFRESH_STYLE
                      }
                      startService(intent)
                  }
              }

              private fun createGlassCard(): LinearLayout {
                  return LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(16), dp(16), dp(16), dp(16))
                      background = GradientDrawable().apply {
                          cornerRadius = dp(18).toFloat()
                          setColor(Color.parseColor("#12131A"))
                          setStroke(dp(1), Color.parseColor("#22FFFFFF"))
                      }
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      ).apply { bottomMargin = dp(16) }
                  }
              }

              private fun createSectionLabel(txt: String): TextView {
                  return TextView(this).apply {
                      text = txt
                      setTextColor(Color.parseColor("#94A3B8"))
                      textSize = 11f
                      setTypeface(typeface, Typeface.BOLD)
                      letterSpacing = 0.08f
                  }
              }

              private fun createAccentButton(label: String, bgHex: String, fgHex: String, onClick: () -> Unit): Button {
                  return Button(this).apply {
                      text = label
                      isAllCaps = false
                      setTextColor(Color.parseColor(fgHex))
                      textSize = 12.5f
                      setTypeface(typeface, Typeface.BOLD)
                      gravity = Gravity.CENTER
                      background = GradientDrawable().apply {
                          cornerRadius = dp(12).toFloat()
                          setColor(Color.parseColor(bgHex))
                      }
                      setOnClickListener { onClick() }
                  }
              }

              private fun dp(value: Int): Int {
                  return TypedValue.applyDimension(
                      TypedValue.COMPLEX_UNIT_DIP,
                      value.toFloat(),
                      resources.displayMetrics
                  ).toInt()
              }
          }
          EOF

      - name: Compile Debug APK with Plain Console Logs
        working-directory: android_app
        run: |
          gradle assembleDebug --console=plain

      - name: Upload Compiled Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CineSub-Floating-Player-APK
          path: android_app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

