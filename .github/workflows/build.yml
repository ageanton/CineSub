                  headerRow.addView(titleTv)
                  headerRow.addView(speedBadgeLabel)
                  headerRow.addView(offsetLabel)
                  headerRow.addView(minimizeBtn)
                  headerRow.addView(closeBtn)

                  // Timeline Scrubber Row
                  val scrubRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(0, dpToPx(8), 0, dpToPx(8))
                  }

                  timeLabel = TextView(this).apply {
                      text = "00:00.0"
                      setTextColor(Color.parseColor("#F59E0B"))
                      textSize = 11.5f
                      typeface = Typeface.MONOSPACE
                  }

                  scrubber = SeekBar(this).apply {
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                      setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                          override fun onProgressChanged(sb: SeekBar?, progress: Int, fromUser: Boolean) {
                              if (fromUser) seekToTimestamp(progress.toLong() - syncOffsetMs)
                          }
                          override fun onStartTrackingTouch(sb: SeekBar?) {}
                          override fun onStopTrackingTouch(sb: SeekBar?) {}
                      })
                  }

                  scrubRow.addView(timeLabel)
                  scrubRow.addView(scrubber)

                  // ROW 1: Main Transport Controls (Wide, prominent Play/Pause button in center)
                  val primaryTransportRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      layoutParams = LinearLayout.LayoutParams(
