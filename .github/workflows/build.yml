                          LinearLayout.LayoutParams.WRAP_CONTENT
                      ).apply { bottomMargin = dpToPx(6) }
                  }

                  val nudgeBack500Btn = createWeightedButton("-0.5s", weight = 1f, heightDp = 44) {
                      adjustSyncOffset(-500L)
                  }

                  playPauseBtn = createWeightedButton(
                      label = "PAUSE",
                      weight = 1.9f,
                      heightDp = 46,
                      bgHex = "#F59E0B",
                      fgHex = "#09090B"
                  ) {
