name: Build CineSub Pro (Native APK + Live Web Preview)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-and-apk"
  cancel-in-progress: false

jobs:
  # ============================================================================
  # JOB 1: FAST INTERACTIVE WEB PREVIEW (DEPLOYS TO GITHUB PAGES)
  # ============================================================================
  web-preview:
    name: "🌐 Deploy Interactive Web Preview"
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Generate Self-Contained Web App & Floating Subtitle Simulator
        run: |
          mkdir -p web_dist
          cat << 'EOF' > web_dist/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
            <title>CineSub Pro — Floating Subtitle Player & Studio</title>
            <link rel="preconnect" href="https://fonts.googleapis.com">
            <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
            <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=DM+Mono:wght@500&family=Inter:wght@400;500;600;700;800&family=Merriweather:ital,wght@0,700;1,400&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet">
            <style>
              :root {
                --bg-obsidian: #08080C;
                --bg-card: rgba(18, 19, 26, 0.78);
                --bg-elevated: rgba(28, 30, 42, 0.85);
                --border-glass: rgba(255, 255, 255, 0.09);
                --border-highlight: rgba(245, 158, 11, 0.45);
                --accent-amber: #F59E0B;
                --accent-indigo: #6366F1;
                --accent-emerald: #10B981;
                --text-primary: #F8FAFC;
                --text-secondary: #94A3B8;
                --text-muted: #64748B;
                --sub-font: 'Atkinson Hyperlegible', sans-serif;
                --sub-size: 24px;
                --sub-color: #FFFFFF;
                --sub-stroke: 4px;
                --sub-bg-opacity: 0.45;
              }
              * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
              body {
                background: radial-gradient(circle at 15% 10%, rgba(99, 102, 241, 0.14), transparent 40%),
                            radial-gradient(circle at 85% 85%, rgba(245, 158, 11, 0.12), transparent 40%),
                            var(--bg-obsidian);
                color: var(--text-primary);
                font-family: 'Inter', -apple-system, sans-serif;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                overflow-x: hidden;
              }
              header {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 14px 24px;
                border-bottom: 1px solid var(--border-glass);
                background: rgba(8, 8, 12, 0.82);
                backdrop-filter: blur(16px);
                position: sticky;
                top: 0;
                z-index: 100;
              }
              .brand {
                display: flex;
                align-items: center;
                gap: 12px;
              }
              .brand-icon {
                width: 36px;
                height: 36px;
                border-radius: 10px;
                background: linear-gradient(135deg, #F59E0B, #EA580C);
                display: grid;
                place-items: center;
                font-weight: 800;
                color: #09090B;
                font-size: 15px;
                box-shadow: 0 4px 18px rgba(245, 158, 11, 0.35);
              }
              .brand-title {
                font-weight: 700;
                font-size: 16px;
                letter-spacing: -0.02em;
              }
              .brand-badge {
                font-size: 11px;
                padding: 2px 8px;
                border-radius: 999px;
                background: rgba(245, 158, 11, 0.15);
                color: var(--accent-amber);
                border: 1px solid rgba(245, 158, 11, 0.3);
                font-weight: 600;
                margin-left: 8px;
              }
              .layout {
                display: grid;
                grid-template-columns: 380px 1fr;
                gap: 22px;
                max-width: 1480px;
                width: 100%;
                margin: 0 auto;
                padding: 22px;
                flex: 1;
              }
              @media (max-width: 1024px) {
                .layout { grid-template-columns: 1fr; padding: 12px; }
              }
              .panel {
                background: var(--bg-card);
                border: 1px solid var(--border-glass);
                border-radius: 20px;
                padding: 20px;
                backdrop-filter: blur(20px);
                display: flex;
                flex-direction: column;
                gap: 18px;
                box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
              }
              .section-label {
                font-size: 11px;
                text-transform: uppercase;
                letter-spacing: 0.09em;
                color: var(--text-secondary);
                font-weight: 700;
                display: flex;
                align-items: center;
                justify-content: space-between;
              }
              .dropzone {
                border: 1.5px dashed rgba(245, 158, 11, 0.45);
                background: rgba(245, 158, 11, 0.05);
                border-radius: 14px;
                padding: 16px;
                text-align: center;
                cursor: pointer;
                transition: 0.2s ease;
              }
              .dropzone:hover {
                background: rgba(245, 158, 11, 0.11);
                border-color: var(--accent-amber);
              }
              .dropzone h4 { font-size: 14px; margin-bottom: 4px; color: #FFF; }
              .dropzone p { font-size: 11px; color: var(--text-secondary); }
              .format-pills {
                display: flex;
                flex-wrap: wrap;
                gap: 6px;
                justify-content: center;
                margin-top: 10px;
              }
              .format-pill {
                font-family: 'DM Mono', monospace;
                font-size: 10px;
                padding: 3px 7px;
                border-radius: 6px;
                background: rgba(255, 255, 255, 0.06);
                color: #CBD5E1;
                border: 1px solid rgba(255, 255, 255, 0.08);
              }
              .control-group {
                display: flex;
                flex-direction: column;
                gap: 8px;
              }
              .control-row {
                display: flex;
                align-items: center;
                justify-content: space-between;
                font-size: 13px;
                color: #E2E8F0;
              }
              select, input[type="range"], .btn {
                width: 100%;
                background: var(--bg-elevated);
                color: #FFF;
                border: 1px solid var(--border-glass);
                border-radius: 10px;
                padding: 9px 12px;
                font-size: 13px;
                font-family: inherit;
                outline: none;
              }
              input[type="range"] {
                padding: 0;
                height: 6px;
                accent-color: var(--accent-amber);
                cursor: pointer;
              }
              .swatch-row {
                display: flex;
                gap: 8px;
              }
              .swatch {
                flex: 1;
                height: 30px;
                border-radius: 8px;
                border: 2px solid transparent;
                cursor: pointer;
                transition: transform 0.15s;
              }
              .swatch.active {
                border-color: var(--accent-amber);
                transform: scale(1.06);
              }
              /* Simulated External App / Video Viewport */
              .stage-container {
                position: relative;
                border-radius: 22px;
                overflow: hidden;
                background: #000;
                border: 1px solid rgba(255, 255, 255, 0.12);
                display: flex;
                flex-direction: column;
                min-height: 580px;
                box-shadow: 0 25px 70px rgba(0,0,0,0.75);
              }
              .mock-os-bar {
                height: 34px;
                background: rgba(12, 13, 18, 0.95);
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 0 16px;
                font-size: 11px;
                color: var(--text-secondary);
                border-bottom: 1px solid rgba(255,255,255,0.06);
                z-index: 10;
              }
              .video-canvas {
                position: relative;
                flex: 1;
                background: #050508;
                display: flex;
                align-items: center;
                justify-content: center;
                overflow: hidden;
              }
              video {
                width: 100%;
                height: 100%;
                object-fit: cover;
                max-height: 660px;
              }
              /* WINDOW A: Click-Through Subtitle Overlay Canvas */
              #window-a-subtitle {
                position: absolute;
                left: 50%;
                bottom: 110px;
                transform: translateX(-50%);
                z-index: 30;
                pointer-events: none;
                text-align: center;
                width: 86%;
                max-width: 820px;
                transition: box-shadow 0.2s;
              }
              #window-a-subtitle.unlocked {
                pointer-events: auto;
                cursor: grab;
                outline: 1.5px dashed var(--accent-amber);
                border-radius: 12px;
              }
              .subtitle-box {
                display: inline-block;
                padding: 8px 18px;
                border-radius: 12px;
                background: rgba(8, 8, 12, var(--sub-bg-opacity));
                backdrop-filter: blur(4px);
                font-family: var(--sub-font);
                font-size: var(--sub-size);
                font-weight: 700;
                color: var(--sub-color);
                line-height: 1.38;
                letter-spacing: 0.01em;
                paint-order: stroke fill;
                -webkit-text-stroke: var(--sub-stroke) rgba(0, 0, 0, 0.95);
                text-shadow: 0 3px 10px rgba(0, 0, 0, 0.85);
              }
              .subtitle-secondary {
                display: block;
                font-size: calc(var(--sub-size) * 0.72);
                color: #CBD5E1;
                margin-top: 4px;
                font-weight: 500;
              }
              /* WINDOW B: Floating Subtitle Video-Player Deck */
              #window-b-controller {
                position: absolute;
                top: 52px;
                right: 18px;
                z-index: 40;
                width: 350px;
                background: rgba(14, 15, 22, 0.86);
                backdrop-filter: blur(22px);
                border: 1px solid rgba(255, 255, 255, 0.14);
                border-radius: 18px;
                padding: 14px;
                box-shadow: 0 18px 48px rgba(0, 0, 0, 0.75);
                transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
              }
              #window-b-controller.collapsed {
                width: 54px;
                height: 54px;
                padding: 0;
                border-radius: 999px;
                display: grid;
                place-items: center;
                cursor: pointer;
                border-color: var(--accent-amber);
                background: rgba(18, 19, 28, 0.92);
              }
              #window-b-controller.collapsed .deck-inner { display: none; }
              #window-b-controller:not(.collapsed) .cc-pill-minimized { display: none; }
              .cc-pill-minimized {
                font-weight: 800;
                color: var(--accent-amber);
                font-size: 15px;
                letter-spacing: -0.03em;
              }
              .deck-header {
                display: flex;
                align-items: center;
                justify-content: space-between;
                cursor: move;
                padding-bottom: 10px;
                border-bottom: 1px solid rgba(255,255,255,0.08);
                margin-bottom: 10px;
              }
              .deck-title {
                font-size: 12px;
                font-weight: 700;
                color: #F8FAFC;
                display: flex;
                align-items: center;
                gap: 6px;
              }
              .status-dot {
                width: 8px;
                height: 8px;
                border-radius: 50%;
                background: var(--accent-emerald);
                box-shadow: 0 0 10px var(--accent-emerald);
              }
              .deck-actions {
                display: flex;
                gap: 6px;
              }
              .icon-btn {
                background: rgba(255,255,255,0.07);
                border: 1px solid rgba(255,255,255,0.1);
                color: #E2E8F0;
                border-radius: 8px;
                padding: 4px 8px;
                font-size: 11px;
                cursor: pointer;
                font-weight: 600;
              }
              .icon-btn.active {
                background: rgba(245, 158, 11, 0.2);
                border-color: var(--accent-amber);
                color: var(--accent-amber);
              }
              .timeline-row {
                display: flex;
                align-items: center;
                gap: 8px;
                margin-bottom: 10px;
              }
              .timestamp {
                font-family: 'DM Mono', monospace;
                font-size: 11px;
                color: var(--accent-amber);
                min-width: 58px;
              }
              .transport-row {
                display: grid;
                grid-template-columns: repeat(5, 1fr);
                gap: 6px;
                margin-bottom: 10px;
              }
              .transport-btn {
                background: rgba(255, 255, 255, 0.07);
                border: 1px solid rgba(255, 255, 255, 0.09);
                color: #FFF;
                border-radius: 10px;
                padding: 8px 4px;
                font-size: 11px;
                font-weight: 600;
                cursor: pointer;
                transition: 0.15s;
              }
              .transport-btn:hover { background: rgba(255, 255, 255, 0.15); }
              .transport-btn.primary {
                background: var(--accent-amber);
                color: #09090B;
                border-color: transparent;
                font-weight: 800;
              }
              .transcript-drawer {
                max-height: 155px;
                overflow-y: auto;
                background: rgba(6, 7, 11, 0.65);
                border-radius: 10px;
                padding: 6px;
                border: 1px solid rgba(255,255,255,0.06);
                display: flex;
                flex-direction: column;
                gap: 4px;
              }
              .cue-item {
                padding: 6px 8px;
                border-radius: 7px;
                font-size: 11px;
                display: flex;
                gap: 8px;
                cursor: pointer;
                color: var(--text-secondary);
                transition: 0.15s;
              }
              .cue-item:hover { background: rgba(255,255,255,0.06); color: #FFF; }
              .cue-item.active {
                background: rgba(245, 158, 11, 0.16);
                color: #FFF;
                border-left: 3px solid var(--accent-amber);
              }
              .cue-time {
                font-family: 'DM Mono', monospace;
                color: var(--accent-amber);
                flex-shrink: 0;
              }
            </style>
          </head>
          <body>
            <header>
              <div class="brand">
                <div class="brand-icon">CC</div>
                <div>
                  <span class="brand-title">CineSub Pro</span>
                  <span class="brand-badge">Dual-Window Overlay Engine</span>
                </div>
              </div>
              <div style="font-size:12px; color:var(--text-secondary);">
                Live Browser Testbed &bull; Native Android APK Compiled in CI
              </div>
            </header>

            <main class="layout">
              <!-- LEFT STUDIO DRAWER -->
              <aside class="panel">
                <div class="section-label">
                  <span>1. Universal Subtitle Loader</span>
                  <span id="cue-count-badge" style="color:var(--accent-amber);">14 Cues Ready</span>
                </div>

                <label class="dropzone" for="sub-file-input">
                  <h4>Drop or Tap to Load Local Subtitle</h4>
                  <p>Auto-detects UTF-8 / UTF-16 / Shift-JIS / Windows-1252</p>
                  <div class="format-pills">
                    <span class="format-pill">.SRT</span>
                    <span class="format-pill">.VTT</span>
                    <span class="format-pill">.ASS / .SSA</span>
                    <span class="format-pill">.SUB</span>
                    <span class="format-pill">.SBV</span>
                    <span class="format-pill">.LRC</span>
                  </div>
                  <input type="file" id="sub-file-input" accept=".srt,.vtt,.ass,.ssa,.sub,.sbv,.lrc,.txt" style="display:none" />
                </label>

                <div class="section-label"><span>2. Cinema Typography Engine</span></div>

                <div class="control-group">
                  <div class="control-row"><span>Dedicated Subtitle Font</span></div>
                  <select id="font-select">
                    <option value="'Atkinson Hyperlegible', sans-serif">Atkinson Hyperlegible (Low-Vision Gold Standard)</option>
                    <option value="'Plus Jakarta Sans', sans-serif">CineSans Broadcast (Netflix / Infuse Pro)</option>
                    <option value="'Merriweather', serif">Cinema Classic Serif (Criterion Arthouse)</option>
                    <option value="'DM Mono', monospace">SDH Closed-Caption Mono (Timing / Accessibility)</option>
                    <option value="'Inter', sans-serif">Universal Geometric Sans (Clean & Modern)</option>
                  </select>
                </div>

                <div class="control-group">
                  <div class="control-row">
                    <span>Font Scale</span>
                    <span id="font-size-val">26px</span>
                  </div>
                  <input type="range" id="font-size-slider" min="16" max="44" value="26" />
                </div>

                <div class="control-group">
                  <div class="control-row">
                    <span>Vector Edge Stroke (Anti-Glare)</span>
                    <span id="stroke-val">4px</span>
                  </div>
                  <input type="range" id="stroke-slider" min="0" max="10" value="4" />
                </div>

                <div class="control-group">
                  <div class="control-row">
                    <span>Dimmer Box Opacity</span>
                    <span id="bg-opacity-val">45%</span>
                  </div>
                  <input type="range" id="bg-opacity-slider" min="0" max="95" value="45" />
                </div>

                <div class="control-group">
                  <div class="control-row"><span>Cinema Tint Presets</span></div>
                  <div class="swatch-row">
                    <div class="swatch active" style="background:#FFFFFF;" data-color="#FFFFFF" title="Pure Cinema White"></div>
                    <div class="swatch" style="background:#FACC15;" data-color="#FACC15" title="Classic 35mm Broadcast Yellow"></div>
                    <div class="swatch" style="background:#38BDF8;" data-color="#38BDF8" title="High-Contrast Cyan"></div>
                    <div class="swatch" style="background:#4ADE80;" data-color="#4ADE80" title="Night-Vision Soft Green"></div>
                  </div>
                </div>

                <div class="section-label"><span>3. Framerate & Sync Calibration</span></div>
                <div class="control-group">
                  <div class="control-row">
                    <span>Framerate Drift Multiplier</span>
                    <span id="fps-val">1.000x (Original)</span>
                  </div>
                  <select id="fps-select">
                    <option value="1">1.000x — Exact 1:1 Monotonic Clock</option>
                    <option value="1.042709">1.0427x — PAL 25fps to 23.976fps Pull-Down</option>
                    <option value="0.95904">0.9590x — 23.976fps to PAL 25fps Speedup</option>
                    <option value="1.001">1.0010x — 24.00fps Cinema to 23.976fps Broadcast</option>
                  </select>
                </div>
              </aside>

              <!-- RIGHT LIVE FLOATING OVERLAY STAGE -->
              <section class="stage-container" id="stage">
                <div class="mock-os-bar">
                  <span>📱 Simulated External Video App (Click-Through Overlay Active)</span>
                  <span id="sync-offset-indicator">Sync Offset: +0.0s</span>
                </div>

                <div class="video-canvas">
                  <video id="demo-video" loop muted playsinline crossorigin="anonymous"
                    poster="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=1200&q=80">
                    <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4" type="video/mp4">
                  </video>

                  <!-- WINDOW A: Untouchable Subtitle Layer (Unless Unlocked) -->
                  <div id="window-a-subtitle">
                    <div class="subtitle-box" id="subtitle-render">
                      "Ready when you are — hit Play on the Floating Subtitle Deck!"
                      <span class="subtitle-secondary" id="subtitle-secondary-render">[CineSub Monotonic Clock Engine Standby]</span>
                    </div>
                  </div>

                  <!-- WINDOW B: Floating Subtitle Video Player Controller -->
                  <div id="window-b-controller">
                    <div class="cc-pill-minimized" id="expand-pill-btn" title="Expand Floating Subtitle Player">CC</div>
                    <div class="deck-inner">
                      <div class="deck-header" id="deck-drag-handle">
                        <div class="deck-title">
                          <span class="status-dot"></span>
                          <span>CineSub Floating Deck</span>
                        </div>
                        <div class="deck-actions">
                          <button class="icon-btn" id="lock-sub-btn" title="Unlock to Drag Subtitle Position">🔒 Pos Locked</button>
                          <button class="icon-btn" id="collapse-deck-btn" title="Dock to Edge Pill">⎯</button>
                        </div>
                      </div>

                      <div class="timeline-row">
                        <span class="timestamp" id="current-time-label">00:00.0</span>
                        <input type="range" id="timeline-scrubber" min="0" max="65000" value="0" />
                        <span class="timestamp" id="total-time-label" style="text-align:right;">01:05.0</span>
                      </div>

                      <div class="transport-row">
                        <button class="transport-btn" id="nudge-back-500">-0.5s</button>
                        <button class="transport-btn" id="nudge-back-100">-0.1s</button>
                        <button class="transport-btn primary" id="play-pause-btn">▶ Play</button>
                        <button class="transport-btn" id="nudge-fwd-100">+0.1s</button>
                        <button class="transport-btn" id="nudge-fwd-500">+0.5s</button>
                      </div>

                      <div class="section-label" style="margin-bottom:6px;">
                        <span>Tap Spoken Line to Instant-Sync</span>
                        <span id="format-detected-label" style="color:var(--accent-amber);">Built-in Demo (.ASS)</span>
                      </div>
                      <div class="transcript-drawer" id="transcript-list"></div>
                    </div>
                  </div>
                </div>
              </section>
            </main>

            <script>
              // =========================================================================
              // MULTI-FORMAT UNIVERSAL SUBTITLE PARSER (.SRT, .VTT, .ASS, .SSA, .SUB, .SBV, .LRC)
              // =========================================================================
              const DEMO_SUBTITLES = [
                { startMs: 0, endMs: 4200, primary: "Welcome to CineSub Pro — the Floating Subtitle Player.", secondary: "[Window A is 100% Click-Through so you never block video taps]" },
                { startMs: 4200, endMs: 8800, primary: "Watching a foreign stream or raw video without closed captions?", secondary: "[Load any local .SRT, .VTT, .ASS, .SUB, .SBV, or .LRC file]" },
                { startMs: 8800, endMs: 13500, primary: "Notice the Atkinson Hyperlegible & vector stroke rendering.", secondary: "[Designed specifically for instant readability over bright scenes]" },
                { startMs: 13500, endMs: 18500, primary: "If the video player is slightly ahead or behind...", secondary: "[Tap -0.5s / +0.5s or click ANY line in the drawer to snap-sync!]" },
                { startMs: 18500, endMs: 24000, primary: "Wait—did you hear that line right on screen?", secondary: "[Tap that line in the Floating Deck to anchor the monotonic clock]" },
                { startMs: 24000, endMs: 30000, primary: "Unlike basic timers, our clock uses monotonic elapsedRealtime.", secondary: "[Zero drift even over a 3-hour cinema marathon]" },
                { startMs: 30000, endMs: 36500, primary: "Unlock 'Pos Locked' to drag the subtitle box anywhere vertically.", secondary: "[Lock it again to restore 100% transparent touch pass-through]" },
                { startMs: 36500, endMs: 43000, primary: "Collapse the controller into a tiny 'CC' edge pill anytime.", secondary: "[Tap the '⎯' button in the top-right of the floating deck]" },
                { startMs: 43000, endMs: 51000, primary: "Supports ASS/SSA anime styling tags & dual-language tracks.", secondary: "[Automatically strips messy override tags like {\\an8} or {\\pos()}]" },
                { startMs: 51000, endMs: 65000, primary: "Download the compiled Native Android APK from GitHub Actions Artifacts!", secondary: "[Runs over Chrome, YouTube, MX Player, or any third-party app]" }
              ];

              let cues = [...DEMO_SUBTITLES];
              let isPlaying = false;
              let anchorElapsedMs = 0;
              let anchorPlaybackMs = 0;
              let currentPlaybackMs = 0;
              let syncOffsetMs = 0;
              let fpsMultiplier = 1.0;
              let subPosLocked = true;

              const videoEl = document.getElementById('demo-video');
              const subRender = document.getElementById('subtitle-render');
              const subSecRender = document.getElementById('subtitle-secondary-render');
              const scrubber = document.getElementById('timeline-scrubber');
              const currentTimeLabel = document.getElementById('current-time-label');
              const totalTimeLabel = document.getElementById('total-time-label');
              const transcriptList = document.getElementById('transcript-list');
              const playPauseBtn = document.getElementById('play-pause-btn');

              function formatTime(ms) {
                const clamped = Math.max(0, Math.floor(ms));
                const totalSec = Math.floor(clamped / 1000);
                const mins = String(Math.floor(totalSec / 60)).padStart(2, '0');
                const secs = String(totalSec % 60).padStart(2, '0');
                const tenths = Math.floor((clamped % 1000) / 100);
                return `${mins}:${secs}.${tenths}`;
              }

              function cleanSubtitleText(raw) {
                return raw
                  .replace(/\{[^}]*\}/g, '') // Strip ASS/SSA override blocks like {\an8}
                  .replace(/<\/?[^>]+(>|$)/g, '') // Strip HTML tags
                  .replace(/\\N/gi, '\n')
                  .trim();
              }

              function parseTimestampToMs(tc) {
                const s = tc.trim().replace(',', '.');
                const parts = s.split(':');
                if (parts.length === 3) {
                  return Math.round((parseFloat(parts[0]) * 3600 + parseFloat(parts[1]) * 60 + parseFloat(parts[2])) * 1000);
                } else if (parts.length === 2) {
                  return Math.round((parseFloat(parts[0]) * 60 + parseFloat(parts[1])) * 1000);
                }
                return 0;
              }

              function parseUniversalSubtitles(content, filename = '') {
                const parsed = [];
                const ext = filename.toLowerCase().split('.').pop();
                const lines = content.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n');

                // 1. ASS / SSA Format
                if (ext === 'ass' || ext === 'ssa' || content.includes('[Events]')) {
                  for (const line of lines) {
                    if (line.startsWith('Dialogue:')) {
                      const body = line.substring(9).trim();
                      const parts = body.split(',');
                      if (parts.length >= 10) {
                        const startMs = parseTimestampToMs(parts[1]);
                        const endMs = parseTimestampToMs(parts[2]);
                        const rawText = parts.slice(9).join(',');
                        const textLines = cleanSubtitleText(rawText).split('\n');
                        parsed.push({
                          startMs,
                          endMs,
                          primary: textLines[0] || '',
                          secondary: textLines.slice(1).join(' ') || ''
                        });
                      }
                    }
                  }
                }
                // 2. LRC Synchronized Lyrics / Captions
                else if (ext === 'lrc' || /^\[\d{2}:\d{2}\.\d{2,3}\]/.test(content.trim())) {
                  const temp = [];
                  for (const line of lines) {
                    const match = line.match(/^\[(\d{2}:\d{2}\.\d{2,3})\](.*)$/);
                    if (match) {
                      temp.push({ startMs: parseTimestampToMs(match[1]), text: cleanSubtitleText(match[2]) });
                    }
                  }
                  for (let i = 0; i < temp.length; i++) {
                    parsed.push({
                      startMs: temp[i].startMs,
                      endMs: temp[i + 1] ? temp[i + 1].startMs : temp[i].startMs + 4000,
                      primary: temp[i].text,
                      secondary: ''
                    });
                  }
                }
                // 3. MicroDVD .SUB ({startFrame}{endFrame}Text)
                else if (ext === 'sub' && /^\{\d+\}\{\d+\}/.test(content.trim())) {
                  const fps = 23.976;
                  for (const line of lines) {
                    const m = line.match(/^\{(\d+)\}\{(\d+)\}(.*)$/);
                    if (m) {
                      const startMs = Math.round((parseInt(m[1], 10) / fps) * 1000);
                      const endMs = Math.round((parseInt(m[2], 10) / fps) * 1000);
                      const parts = cleanSubtitleText(m[3].replace(/\|/g, '\n')).split('\n');
                      parsed.push({ startMs, endMs, primary: parts[0] || '', secondary: parts.slice(1).join(' ') });
                    }
                  }
                }
                // 4. SRT / WebVTT / YouTube SBV Blocks
                else {
                  const blocks = content.replace(/\r\n/g, '\n').split(/\n\s*\n/);
                  for (const block of blocks) {
                    const bLines = block.trim().split('\n');
                    if (!bLines.length) continue;
                    let timeIdx = bLines.findIndex(l => l.includes('-->') || /^\d+:\d+:\d+\.\d+,\d+:\d+:\d+\.\d+$/.test(l.trim()));
                    if (timeIdx !== -1) {
                      const tLine = bLines[timeIdx];
                      const sep = tLine.includes('-->') ? '-->' : ',';
                      const [sRaw, eRaw] = tLine.split(sep);
                      const startMs = parseTimestampToMs(sRaw.trim().split(' ')[0]);
                      const endMs = parseTimestampToMs(eRaw.trim().split(' ')[0]);
                      const textLines = bLines.slice(timeIdx + 1).map(cleanSubtitleText).filter(Boolean);
                      if (textLines.length) {
                        parsed.push({
                          startMs,
                          endMs,
                          primary: textLines[0],
                          secondary: textLines.slice(1).join(' ')
                        });
                      }
                    }
                  }
                }
                return parsed.sort((a, b) => a.startMs - b.startMs);
              }

              function renderTranscriptDrawer() {
                transcriptList.innerHTML = '';
                cues.forEach((cue, idx) => {
                  const row = document.createElement('div');
                  row.className = 'cue-item';
                  row.dataset.index = idx;
                  row.innerHTML = `<span class="cue-time">${formatTime(cue.startMs)}</span><span>${cue.primary}</span>`;
                  row.addEventListener('click', () => {
                    seekToMs(cue.startMs);
                  });
                  transcriptList.appendChild(row);
                });
                const maxEnd = cues.length ? cues[cues.length - 1].endMs : 65000;
                scrubber.max = maxEnd;
                totalTimeLabel.textContent = formatTime(maxEnd);
                document.getElementById('cue-count-badge').textContent = `${cues.length} Cues Ready`;
              }

              function seekToMs(targetMs) {
                currentPlaybackMs = Math.max(0, targetMs);
                anchorPlaybackMs = currentPlaybackMs;
                anchorElapsedMs = performance.now();
                updateOverlayFrame();
              }

              function binarySearchCue(timeMs) {
                let low = 0, high = cues.length - 1;
                while (low <= high) {
                  const mid = (low + high) >> 1;
                  const c = cues[mid];
                  if (timeMs >= c.startMs && timeMs <= c.endMs) return mid;
                  if (timeMs < c.startMs) high = mid - 1;
                  else low = mid + 1;
                }
                return -1;
              }

              function updateOverlayFrame() {
                if (isPlaying) {
                  const delta = (performance.now() - anchorElapsedMs) * fpsMultiplier;
                  currentPlaybackMs = anchorPlaybackMs + delta;
                }
                const effectiveMs = Math.max(0, currentPlaybackMs + syncOffsetMs);
                scrubber.value = Math.min(scrubber.max, effectiveMs);
                currentTimeLabel.textContent = formatTime(effectiveMs);

                const activeIdx = binarySearchCue(effectiveMs);
                const items = transcriptList.querySelectorAll('.cue-item');
                items.forEach((el, idx) => el.classList.toggle('active', idx === activeIdx));

                if (activeIdx !== -1) {
                  const c = cues[activeIdx];
                  subRender.childNodes[0].nodeValue = c.primary + ' ';
                  subSecRender.textContent = c.secondary || '';
                  subRender.style.opacity = '1';
                } else {
                  subRender.style.opacity = '0.18';
                  subRender.childNodes[0].nodeValue = '• • • ';
                  subSecRender.textContent = '';
                }

                if (isPlaying) requestAnimationFrame(updateOverlayFrame);
              }

              playPauseBtn.addEventListener('click', () => {
                isPlaying = !isPlaying;
                if (isPlaying) {
                  anchorPlaybackMs = currentPlaybackMs;
                  anchorElapsedMs = performance.now();
                  playPauseBtn.textContent = '⏸ Pause';
                  videoEl.play().catch(() => {});
                  requestAnimationFrame(updateOverlayFrame);
                } else {
                  playPauseBtn.textContent = '▶ Play';
                  videoEl.pause();
                }
              });

              scrubber.addEventListener('input', (e) => seekToMs( parseFloat(e.target.value) - syncOffsetMs ));

              function adjustSyncOffset(deltaMs) {
                syncOffsetMs += deltaMs;
                const sign = syncOffsetMs >= 0 ? '+' : '';
                document.getElementById('sync-offset-indicator').textContent = `Sync Offset: ${sign}${(syncOffsetMs / 1000).toFixed(1)}s`;
                updateOverlayFrame();
              }

              document.getElementById('nudge-back-500').onclick = () => adjustSyncOffset(-500);
              document.getElementById('nudge-back-100').onclick = () => adjustSyncOffset(-100);
              document.getElementById('nudge-fwd-100').onclick = () => adjustSyncOffset(100);
              document.getElementById('nudge-fwd-500').onclick = () => adjustSyncOffset(500);

              // File Upload Handler
              document.getElementById('sub-file-input').addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                  const parsed = parseUniversalSubtitles(ev.target.result, file.name);
                  if (parsed.length > 0) {
                    cues = parsed;
                    document.getElementById('format-detected-label').textContent = file.name;
                    renderTranscriptDrawer();
                    seekToMs(0);
                  }
                };
                reader.readAsText(file);
              });

              // Typography Studio Controls
              document.getElementById('font-select').addEventListener('change', (e) => {
                document.documentElement.style.setProperty('--sub-font', e.target.value);
              });
              document.getElementById('font-size-slider').addEventListener('input', (e) => {
                document.documentElement.style.setProperty('--sub-size', e.target.value + 'px');
                document.getElementById('font-size-val').textContent = e.target.value + 'px';
              });
              document.getElementById('stroke-slider').addEventListener('input', (e) => {
                document.documentElement.style.setProperty('--sub-stroke', e.target.value + 'px');
                document.getElementById('stroke-val').textContent = e.target.value + 'px';
              });
              document.getElementById('bg-opacity-slider').addEventListener('input', (e) => {
                document.documentElement.style.setProperty('--sub-bg-opacity', (e.target.value / 100).toFixed(2));
                document.getElementById('bg-opacity-val').textContent = e.target.value + '%';
              });
              document.querySelectorAll('.swatch').forEach(sw => {
                sw.addEventListener('click', () => {
                  document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
                  sw.classList.add('active');
                  document.documentElement.style.setProperty('--sub-color', sw.dataset.color);
                });
              });
              document.getElementById('fps-select').addEventListener('change', (e) => {
                fpsMultiplier = parseFloat(e.target.value);
                document.getElementById('fps-val').textContent = `${fpsMultiplier.toFixed(3)}x`;
              });

              // Collapse / Expand Floating Deck
              const controllerEl = document.getElementById('window-b-controller');
              document.getElementById('collapse-deck-btn').onclick = (e) => {
                e.stopPropagation();
                controllerEl.classList.add('collapsed');
              };
              document.getElementById('expand-pill-btn').onclick = () => {
                controllerEl.classList.remove('collapsed');
              };

              // Unlock / Lock Window A Subtitle Dragging
              const winASub = document.getElementById('window-a-subtitle');
              const lockBtn = document.getElementById('lock-sub-btn');
              lockBtn.onclick = () => {
                subPosLocked = !subPosLocked;
                winASub.classList.toggle('unlocked', !subPosLocked);
                lockBtn.classList.toggle('active', !subPosLocked);
                lockBtn.textContent = subPosLocked ? '🔒 Pos Locked' : '✋ Drag Sub';
              };

              let draggingSub = false, subStartY = 0, subStartBottom = 110;
              winASub.addEventListener('pointerdown', (e) => {
                if (subPosLocked) return;
                draggingSub = true;
                subStartY = e.clientY;
                subStartBottom = parseInt(getComputedStyle(winASub).bottom, 10) || 110;
                winASub.setPointerCapture(e.pointerId);
              });
              winASub.addEventListener('pointermove', (e) => {
                if (!draggingSub) return;
                const dy = subStartY - e.clientY;
                winASub.style.bottom = Math.max(20, Math.min(440, subStartBottom + dy)) + 'px';
              });
              winASub.addEventListener('pointerup', () => draggingSub = false);

              renderTranscriptDrawer();
            </script>
          </body>
          </html>
          EOF

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web_dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ============================================================================
  # JOB 2: NATIVE ANDROID APK BUILD (PURE KOTLIN + EMBEDDED CINEMA FONTS)
  # ============================================================================
  android-apk:
    name: "🤖 Compile Native Android APK"
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle & Download Dedicated Subtitle Fonts
        run: |
          sudo apt-get update && sudo apt-get install -y wget unzip curl
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip -O /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.7/bin" >> $GITHUB_PATH

          mkdir -p android_app/app/src/main/assets/fonts
          mkdir -p android_app/app/src/main/res/drawable
          mkdir -p android_app/app/src/main/res/values
          mkdir -p android_app/app/src/main/java/com/cinesub/overlay

          # Fetch real open-source Cinema & Accessibility TTF Fonts directly into APK assets
          curl -sL "https://github.com/google/fonts/raw/main/ofl/atkinsonhyperlegible/AtkinsonHyperlegible-Bold.ttf" \
            -o android_app/app/src/main/assets/fonts/atkinson_hyperlegible_bold.ttf || true
          curl -sL "https://github.com/google/fonts/raw/main/ofl/plusjakartasans/PlusJakartaSans%5Bwght%5D.ttf" \
            -o android_app/app/src/main/assets/fonts/cinesans_bold.ttf || true
          curl -sL "https://github.com/google/fonts/raw/main/ofl/dmmono/DMMono-Medium.ttf" \
            -o android_app/app/src/main/assets/fonts/dm_mono_medium.ttf || true
          curl -sL "https://github.com/google/fonts/raw/main/ofl/merriweather/Merriweather-Bold.ttf" \
            -o android_app/app/src/main/assets/fonts/cinema_serif_bold.ttf || true

      - name: Generate Android Gradle Project Configuration
