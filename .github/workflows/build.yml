name: Build CineSub Pro (Native APK + Live Web Preview)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-and-apk"
  cancel-in-progress: false

jobs:
  # ============================================================================
  # JOB 1: FAST INTERACTIVE WEB PREVIEW (DEPLOYS TO GITHUB PAGES)
  # ============================================================================
  web-preview:
    name: "🌐 Deploy Interactive Web Preview"
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Generate Self-Contained Web App & Floating Subtitle Simulator
        run: |
          mkdir -p web_dist
          cat << 'EOF' > web_dist/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
            <title>CineSub Pro — Floating Subtitle Player & Studio</title>
            <link rel="preconnect" href="https://fonts.googleapis.com">
            <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
            <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=DM+Mono:wght@500&family=Inter:wght@400;500;600;700;800&family=Merriweather:ital,wght@0,700;1,400&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet">
            <style>
              :root {
                --bg-obsidian: #08080C;
                --bg-card: rgba(18, 19, 26, 0.78);
                --bg-elevated: rgba(28, 30, 42, 0.85);
                --border-glass: rgba(255, 255, 255, 0.09);
                --border-highlight: rgba(245, 158, 11, 0.45);
                --accent-amber: #F59E0B;
                --accent-indigo: #6366F1;
                --accent-emerald: #10B981;
                --text-primary: #F8FAFC;
                --text-secondary: #94A3B8;
                --text-muted: #64748B;
                --sub-font: 'Atkinson Hyperlegible', sans-serif;
                --sub-size: 24px;
                --sub-color: #FFFFFF;
                --sub-stroke: 4px;
                --sub-bg-opacity: 0.45;
              }
              * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
              body {
                background: radial-gradient(circle at 15% 10%, rgba(99, 102, 241, 0.14), transparent 40%),
                            radial-gradient(circle at 85% 85%, rgba(245, 158, 11, 0.12), transparent 40%),
                            var(--bg-obsidian);
                color: var(--text-primary);
                font-family: 'Inter', -apple-system, sans-serif;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                overflow-x: hidden;
              }
              header {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 14px 24px;
                border-bottom: 1px solid var(--border-glass);
                background: rgba(8, 8, 12, 0.82);
                backdrop-filter: blur(16px);
                position: sticky;
                top: 0;
                z-index: 100;
              }
              .brand {
                display: flex;
                align-items: center;
                gap: 12px;
              }
              .brand-icon {
                width: 36px;
                height: 36px;
                border-radius: 10px;
                background: linear-gradient(135deg, #F59E0B, #EA580C);
                display: grid;
                place-items: center;
                font-weight: 800;
                color: #09090B;
                font-size: 15px;
                box-shadow: 0 4px 18px rgba(245, 158, 11, 0.35);
              }
              .brand-title {
                font-weight: 700;
                font-size: 16px;
                letter-spacing: -0.02em;
              }
              .brand-badge {
                font-size: 11px;
                padding: 2px 8px;
                border-radius: 999px;
                background: rgba(245, 158, 11, 0.15);
                color: var(--accent-amber);
                border: 1px solid rgba(245, 158, 11, 0.3);
                font-weight: 600;
                margin-left: 8px;
              }
              .layout {
                display: grid;
                grid-template-columns: 380px 1fr;
                gap: 22px;
                max-width: 1480px;
                width: 100%;
                margin: 0 auto;
                padding: 22px;
                flex: 1;
              }
              @media (max-width: 1024px) {
                .layout { grid-template-columns: 1fr; padding: 12px; }
              }
              .panel {
                background: var(--bg-card);
                border: 1px solid var(--border-glass);
                border-radius: 20px;
                padding: 20px;
                backdrop-filter: blur(20px);
                display: flex;
                flex-direction: column;
                gap: 18px;
                box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
              }
              .section-label {
                font-size: 11px;
                text-transform: uppercase;
                letter-spacing: 0.09em;
                color: var(--text-secondary);
                font-weight: 700;
                display: flex;
                align-items: center;
                justify-content: space-between;
              }
              .dropzone {
                border: 1.5px dashed rgba(245, 158, 11, 0.45);
                background: rgba(245, 158, 11, 0.05);
                border-radius: 14px;
                padding: 16px;
                text-align: center;
                cursor: pointer;
                transition: 0.2s ease;
              }
              .dropzone:hover {
                background: rgba(245, 158, 11, 0.11);
                border-color: var(--accent-amber);
              }
              .dropzone h4 { font-size: 14px; margin-bottom: 4px; color: #FFF; }
              .dropzone p { font-size: 11px; color: var(--text-secondary); }
              .format-pills {
                display: flex;
                flex-wrap: wrap;
                gap: 6px;
                justify-content: center;
                margin-top: 10px;
              }
              .format-pill {
                font-family: 'DM Mono', monospace;
                font-size: 10px;
                padding: 3px 7px;
                border-radius: 6px;
                background: rgba(255, 255, 255, 0.06);
                color: #CBD5E1;
                border: 1px solid rgba(255, 255, 255, 0.08);
              }
              .control-group {
                display: flex;
                flex-direction: column;
                gap: 8px;
              }
              .control-row {
                display: flex;
                align-items: center;
                justify-content: space-between;
                font-size: 13px;
                color: #E2E8F0;
              }
              select, input[type="range"], .btn {
                width: 100%;
                background: var(--bg-elevated);
                color: #FFF;
                border: 1px solid var(--border-glass);
                border-radius: 10px;
                padding: 9px 12px;
                font-size: 13px;
                font-family: inherit;
                outline: none;
              }
              input[type="range"] {
                padding: 0;
                height: 6px;
                accent-color: var(--accent-amber);
                cursor: pointer;
              }
              .swatch-row {
                display: flex;
                gap: 8px;
              }
              .swatch {
                flex: 1;
                height: 30px;
                border-radius: 8px;
                border: 2px solid transparent;
                cursor: pointer;
                transition: transform 0.15s;
              }
              .swatch.active {
                border-color: var(--accent-amber);
                transform: scale(1.06);
              }
              /* Simulated External App / Video Viewport */
              .stage-container {
                position: relative;
                border-radius: 22px;
                overflow: hidden;
                background: #000;
                border: 1px solid rgba(255, 255, 255, 0.12);
                display: flex;
                flex-direction: column;
                min-height: 580px;
                box-shadow: 0 25px 70px rgba(0,0,0,0.75);
              }
              .mock-os-bar {
                height: 34px;
                background: rgba(12, 13, 18, 0.95);
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 0 16px;
                font-size: 11px;
                color: var(--text-secondary);
                border-bottom: 1px solid rgba(255,255,255,0.06);
                z-index: 10;
              }
              .video-canvas {
                position: relative;
                flex: 1;
                background: #050508;
                display: flex;
                align-items: center;
                justify-content: center;
                overflow: hidden;
              }
              video {
                width: 100%;
                height: 100%;
                object-fit: cover;
                max-height: 660px;
              }
              /* WINDOW A: Click-Through Subtitle Overlay Canvas */
              #window-a-subtitle {
                position: absolute;
                left: 50%;
                bottom: 110px;
                transform: translateX(-50%);
                z-index: 30;
                pointer-events: none;
                text-align: center;
                width: 86%;
                max-width: 820px;
                transition: box-shadow 0.2s;
              }
              #window-a-subtitle.unlocked {
                pointer-events: auto;
                cursor: grab;
                outline: 1.5px dashed var(--accent-amber);
                border-radius: 12px;
              }
              .subtitle-box {
                display: inline-block;
                padding: 8px 18px;
                border-radius: 12px;
                background: rgba(8, 8, 12, var(--sub-bg-opacity));
                backdrop-filter: blur(4px);
                font-family: var(--sub-font);
                font-size: var(--sub-size);
                font-weight: 700;
                color: var(--sub-color);
                line-height: 1.38;
                letter-spacing: 0.01em;
                paint-order: stroke fill;
                -webkit-text-stroke: var(--sub-stroke) rgba(0, 0, 0, 0.95);
                text-shadow: 0 3px 10px rgba(0, 0, 0, 0.85);
              }
              .subtitle-secondary {
                display: block;
                font-size: calc(var(--sub-size) * 0.72);
                color: #CBD5E1;
                margin-top: 4px;
                font-weight: 500;
              }
              /* WINDOW B: Floating Subtitle Video-Player Deck */
              #window-b-controller {
                position: absolute;
                top: 52px;
                right: 18px;
                z-index: 40;
                width: 350px;
                background: rgba(14, 15, 22, 0.86);
                backdrop-filter: blur(22px);
                border: 1px solid rgba(255, 255, 255, 0.14);
                border-radius: 18px;
                padding: 14px;
                box-shadow: 0 18px 48px rgba(0, 0, 0, 0.75);
                transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
              }
              #window-b-controller.collapsed {
                width: 54px;
                height: 54px;
                padding: 0;
                border-radius: 999px;
                display: grid;
                place-items: center;
                cursor: pointer;
                border-color: var(--accent-amber);
                background: rgba(18, 19, 28, 0.92);
              }
              #window-b-controller.collapsed .deck-inner { display: none; }
              #window-b-controller:not(.collapsed) .cc-pill-minimized { display: none; }
              .cc-pill-minimized {
                font-weight: 800;
                color: var(--accent-amber);
                font-size: 15px;
                letter-spacing: -0.03em;
              }
              .deck-header {
                display: flex;
                align-items: center;
                justify-content: space-between;
                cursor: move;
                padding-bottom: 10px;
                border-bottom: 1px solid rgba(255,255,255,0.08);
                margin-bottom: 10px;
              }
              .deck-title {
                font-size: 12px;
                font-weight: 700;
                color: #F8FAFC;
                display: flex;
                align-items: center;
                gap: 6px;
              }
              .status-dot {
                width: 8px;
                height: 8px;
                border-radius: 50%;
                background: var(--accent-emerald);
                box-shadow: 0 0 10px var(--accent-emerald);
              }
              .deck-actions {
                display: flex;
                gap: 6px;
              }
              .icon-btn {
                background: rgba(255,255,255,0.07);
                border: 1px solid rgba(255,255,255,0.1);
                color: #E2E8F0;
                border-radius: 8px;
                padding: 4px 8px;
                font-size: 11px;
                cursor: pointer;
                font-weight: 600;
              }
              .icon-btn.active {
                background: rgba(245, 158, 11, 0.2);
                border-color: var(--accent-amber);
                color: var(--accent-amber);
              }
              .timeline-row {
                display: flex;
                align-items: center;
                gap: 8px;
                margin-bottom: 10px;
              }
              .timestamp {
                font-family: 'DM Mono', monospace;
                font-size: 11px;
                color: var(--accent-amber);
                min-width: 58px;
              }
              .transport-row {
                display: grid;
                grid-template-columns: repeat(5, 1fr);
                gap: 6px;
                margin-bottom: 10px;
              }
              .transport-btn {
                background: rgba(255, 255, 255, 0.07);
                border: 1px solid rgba(255, 255, 255, 0.09);
                color: #FFF;
                border-radius: 10px;
                padding: 8px 4px;
                font-size: 11px;
                font-weight: 600;
                cursor: pointer;
                transition: 0.15s;
              }
              .transport-btn:hover { background: rgba(255, 255, 255, 0.15); }
              .transport-btn.primary {
                background: var(--accent-amber);
                color: #09090B;
                border-color: transparent;
                font-weight: 800;
              }
              .transcript-drawer {
                max-height: 155px;
                overflow-y: auto;
                background: rgba(6, 7, 11, 0.65);
                border-radius: 10px;
                padding: 6px;
                border: 1px solid rgba(255,255,255,0.06);
                display: flex;
                flex-direction: column;
                gap: 4px;
              }
              .cue-item {
                padding: 6px 8px;
                border-radius: 7px;
                font-size: 11px;
                display: flex;
                gap: 8px;
                cursor: pointer;
                color: var(--text-secondary);
                transition: 0.15s;
              }
              .cue-item:hover { background: rgba(255,255,255,0.06); color: #FFF; }
              .cue-item.active {
                background: rgba(245, 158, 11, 0.16);
                color: #FFF;
                border-left: 3px solid var(--accent-amber);
              }
              .cue-time {
                font-family: 'DM Mono', monospace;
                color: var(--accent-amber);
                flex-shrink: 0;
              }
            </style>
          </head>
          <body>
            <header>
              <div class="brand">
                <div class="brand-icon">CC</div>
                <div>
                  <span class="brand-title">CineSub Pro</span>
                  <span class="brand-badge">Dual-Window Overlay Engine</span>
                </div>
              </div>
              <div style="font-size:12px; color:var(--text-secondary);">
                Live Browser Testbed &bull; Native Android APK Compiled in CI
              </div>
            </header>

            <main class="layout">
              <!-- LEFT STUDIO DRAWER -->
              <aside class="panel">
                <div class="section-label">
                  <span>1. Universal Subtitle Loader</span>
                  <span id="cue-count-badge" style="color:var(--accent-amber);">14 Cues Ready</span>
                </div>

                <label class="dropzone" for="sub-file-input">
                  <h4>Drop or Tap to Load Local Subtitle</h4>
                  <p>Auto-detects UTF-8 / UTF-16 / Shift-JIS / Windows-1252</p>
                  <div class="format-pills">
                    <span class="format-pill">.SRT</span>
                    <span class="format-pill">.VTT</span>
                    <span class="format-pill">.ASS / .SSA</span>
                    <span class="format-pill">.SUB</span>
                    <span class="format-pill">.SBV</span>
                    <span class="format-pill">.LRC</span>
                  </div>
                  <input type="file" id="sub-file-input" accept=".srt,.vtt,.ass,.ssa,.sub,.sbv,.lrc,.txt" style="display:none" />
                </label>

                <div class="section-label"><span>2. Cinema Typography Engine</span></div>

                <div class="control-group">
                  <div class="control-row"><span>Dedicated Subtitle Font</span></div>
                  <select id="font-select">
                    <option value="'Atkinson Hyperlegible', sans-serif">Atkinson Hyperlegible (Low-Vision Gold Standard)</option>
                    <option value="'Plus Jakarta Sans', sans-serif">CineSans Broadcast (Netflix / Infuse Pro)</option>
                    <option value="'Merriweather', serif">Cinema Classic Serif (Criterion Arthouse)</option>
                    <option value="'DM Mono', monospace">SDH Closed-Caption Mono (Timing / Accessibility)</option>
                    <option value="'Inter', sans-serif">Universal Geometric Sans (Clean & Modern)</option>
                  </select>
                </div>

                <div class="control-group">
                  <div class="control-row">
                    <span>Font Scale</span>
                    <span id="font-size-val">26px</span>
                  </div>
                  <input type="range" id="font-size-slider" min="16" max="44" value="26" />
                </div>

                <div class="control-group">
                  <div class="control-row">
                    <span>Vector Edge Stroke (Anti-Glare)</span>
                    <span id="stroke-val">4px</span>
                  </div>
                  <input type="range" id="stroke-slider" min="0" max="10" value="4" />
                </div>

                <div class=
