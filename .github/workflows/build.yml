          PYEOF

      - name: Configure Android SDK & Compile APK with Gradle 8.7
        shell: bash
        run: |
          set -e
          export ANDROID_HOME="/usr/local/lib/android/sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "sdk.dir=$ANDROID_HOME" > android_app/local.properties

          if [ -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          fi

          curl -sL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q -o /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.7/bin/gradle -p android_app assembleDebug --console=plain --stacktrace

      - name: Upload Compiled Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CineSub-Floating-Player-APK
          path: android_app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
