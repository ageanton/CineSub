                  }.apply {
                      textSize = 13.5f
                  }

                  val nudgeFwd500Btn = createWeightedButton("+0.5s", weight = 1f, heightDp = 44) {
                      adjustSyncOffset(500L)
                  }

                  primaryTransportRow.addView(nudgeBack500Btn)
                  primaryTransportRow.addView(playPauseBtn)
                  primaryTransportRow.addView(nudgeFwd500Btn)

                  // ROW 2: Secondary Fine-Sync & Utility Controls (-0.1s | +0.1s | Lines | Move)
                  val secondaryUtilityRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      )
                  }

                  val nudgeBack100Btn = createWeightedButton("-0.1s", weight = 1f, heightDp = 36) {
                      adjustSyncOffset(-100L)
                  }
                  val nudgeFwd100Btn = createWeightedButton("+0.1s", weight = 1f, heightDp = 36) {
                      adjustSyncOffset(100L)
                  }
                  linesToggleBtn = createWeightedButton("Lines", weight = 1.2f, heightDp = 36) {
                      isTranscriptOpen = !isTranscriptOpen
                      transcriptListView.visibility = if (isTranscriptOpen) View.VISIBLE else View.GONE
                      linesToggleBtn.setTextColor(
                          if (isTranscriptOpen) Color.parseColor("#F59E0B") else Color.WHITE
                      )
                      if (isTranscriptOpen) {
                          transcriptAdapter.notifyDataSetChanged()
                          val idx = SubtitleParser.findNearestCueIndexForScroll(
                              SubtitleRepository.activeCues,
                              (currentPlaybackMs + syncOffsetMs).coerceAtLeast(0L)
                          )
